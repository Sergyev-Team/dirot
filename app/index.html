<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

<title>משרד סרגייב</title>

<style>
:root{--bg:#FFFFFF;--surface:#fff;--fg:#1B1D21;--muted:#646973;--line:#ECE7DC;--gold:#B08A3E;--gold-ink:#7F6124;--gold-soft:#FBF5E7;--ok:#17744A;--bad:#A62B2B;--bad-soft:#FCEFEE;--on-gold:#fff;--font:"Assistant","Arial Hebrew",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:inherit}
.page{max-width:680px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:44px}
.head-acts{display:flex;align-items:center;gap:4px;flex:none}
h1{font-size:25px;line-height:1.2;margin:0;font-weight:700}
h2{font-size:15px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.bad{color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.btn.link{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 8px;min-height:40px}
.btn:disabled{opacity:.55;cursor:default}
.count{display:inline-block;min-width:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:13px;line-height:20px;text-align:center}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{width:100%;min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.in{min-height:84px;resize:vertical;display:block}
.ltr{direction:ltr;text-align:right}
.flts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.flt span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:2px}
.flt select{min-height:42px;padding:6px 8px;font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;margin-bottom:6px}
.bar .sub{margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:62px;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:right;text-decoration:none}
.row:last-child{border-bottom:0}
.row .main{min-width:0;flex:1}
.row b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{flex:none;font-size:15px;color:var(--muted);text-align:left}
.late{color:var(--bad);font-weight:700}
.now{color:var(--gold-ink);font-weight:700}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink);direction:ltr}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat{padding:12px 8px;text-align:center;background:none;border:0;border-inline-start:1px solid var(--line);text-decoration:none}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font-size:26px;line-height:1.15}
.stat span{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 10px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:5px 13px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;background:none;border:0;border-inline-start:1px solid var(--line);font-weight:700;font-size:15px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card>h2:first-child{margin-top:0}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.quick .btn{padding:5px 9px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{padding:8px 0;border-bottom:1px solid var(--line);font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.note:last-child{border-bottom:0;padding-bottom:0}
.empty{padding:22px 14px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.alert{padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:600;margin-bottom:12px;font-size:15px}
.task{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);background:none;padding:0;display:grid;place-items:center;color:var(--on-gold)}
.check[aria-pressed="true"]{background:var(--gold)}
.task .main{flex:1;min-width:0}
.task .txt{overflow-wrap:anywhere}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task small{color:var(--muted);font-size:14px}
.x{flex:none;width:40px;height:40px;background:none;border:0;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.add .t{grid-column:1/-1}
.price{font-size:24px;font-weight:700;margin:6px 0 10px}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.spec{padding:3px 9px;border-radius:7px;background:var(--bg);font-size:15px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px}
.kv span{color:var(--muted)}
.person{padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0;padding-bottom:0}
.person:first-of-type{padding-top:0}
.person b{display:block}
.person small{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.person .acts{margin:10px 0 0}
.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(27,29,33,.05)}
.bnav #tabs{max-width:760px;margin:0 auto;display:flex}
.bnav a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:4px 2px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;position:relative;white-space:nowrap}
.bnav a[aria-current="page"]{color:var(--gold-ink)}
.bnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav .count{position:absolute;top:5px;inset-inline-start:calc(50% + 6px)}
.frames{position:fixed;left:0;right:0;top:0;bottom:var(--bh,64px);z-index:1}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
body.boards #app{display:none}
body:not(.boards) .frames{display:none}
body.navon .page{padding-bottom:calc(var(--bh,64px) + 28px)}
.login .lbox{width:100%;max-width:380px}
.login .reg{margin-top:12px;padding:18px 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center}
.login .reg h2{margin:0 0 4px;color:var(--fg);font-size:18px}
.login .reg p{margin:0 0 12px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px 0 10px;margin-inline-start:-4px;background:none;border:0;color:var(--muted);font-weight:600;text-decoration:none}
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.login img{display:block;height:64px;margin:0 auto 18px;background:#fff;border-radius:8px;padding:3px 8px}
.login h1{margin-bottom:4px}
.login p{color:var(--muted);margin:0 0 18px}
.code{font-size:26px;font-weight:700;letter-spacing:5px;text-align:center;direction:ltr}
.err{color:var(--bad);font-weight:600;font-size:15px;margin:0 0 12px}
.toast{position:fixed;z-index:9;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;padding:11px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:600;text-align:center}
.load{padding:60px 0;text-align:center;color:var(--muted)}
.more{margin-top:10px}
.imp{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.imp label{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border-bottom:1px solid var(--line)}
.imp label:last-child{border-bottom:0}
.imp input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.imp .main{flex:1;min-width:0}
.imp b{display:block}
.imp small{display:block;color:var(--muted);font-size:14px}
.imp .warn{color:var(--bad)}
.file{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--muted);font-weight:600;cursor:pointer}
.file input{display:none}
.frame{position:fixed;inset:0 0 calc(62px + env(safe-area-inset-bottom)) 0;width:100%;height:calc(100dvh - 62px - env(safe-area-inset-bottom));border:0;background:var(--bg)}
.pick{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line)}
.pick:last-of-type{border-bottom:0}
.pick input{flex:none;width:22px;height:22px;accent-color:var(--gold)}
.pick .main{flex:1;min-width:0}
.pick b{display:block;font-weight:700}
.pick small{display:block;color:var(--muted);font-size:15px}
.pick a{flex:none;color:var(--gold-ink);font-size:15px;font-weight:600}
details.card summary{font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;min-height:28px}
details.card[open] summary{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:600}
.ck input{width:20px;height:20px;accent-color:var(--gold)}
.tri{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg{padding:8px 10px;border-radius:9px;background:var(--bg);margin-bottom:6px;font-size:16px;overflow-wrap:anywhere}
.msg.me{background:var(--gold-soft)}
.msg small{display:block;color:var(--muted);font-size:13px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-bottom:12px}
.nums b{display:block;font-size:22px}
.nums span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="load">טוען…</div></div>
<div class="frames" id="frames"></div>
<nav class="bnav" id="bar" hidden aria-label="ניווט ראשי"><div id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
'use strict';
var SB = 'https://zqpgzcgvvhaokaimedio.supabase.co';
var KEY = 'sb_publishable_pHWmO4yjoVO3CvkNUE8u3g_spxQJHib';
var SHEET_API = 'https://script.google.com/macros/s/AKfycbxSon5hLywrAVGN2OGTQFec5uNZpkzgI243GnyBu230r1Sj5ErPJXXX414v9Tsl6UnC/exec';
var SITE = 'https://sergeyev-team.com/';
var RT_KEY = 'sg_app_rt', SIGN_KEY = 'sergyev_agent_code';
// הקובץ שכל סוכן מעתיק לחשבון הגוגל שלו (חיבור אנשי הקשר)
var CONTACTS_COPY = '';
var PAGE = 60, TZ = 'Asia/Jerusalem';
var BUYER_COLS = 'id,agent_id,name,phone,phone9,profile_name,rating,notes,status,last_contact,next_contact,sheet_id,created_at,new_at';
var TASK_COLS = 'id,agent_id,due,text,ref,ref_label,done,done_at,created_at';
var INTERVAL = { 'A++': 3, 'A+': 7, 'A': 14 };

var app = document.getElementById('app');
var S = { at: null, exp: 0, rt: null, uid: null, email: '' };
var D = { me: null, buyers: [], tasks: [], props: [], agents: [], requests: [], profiles: [], portals: [], outbox: null, signCode: null, loadedAt: 0 };
var UI = { q: '', max: PAGE, pq: '', deal: 'מכירה', pmax: PAGE, draft: {}, pick: {}, mkt: null, portal: null, login: { step: 'login', mode: 'login', email: '', err: '', busy: false } };
function freshFilters() { return { b: { status: 'active', due: '', rate: '', agent: '' }, t: { view: 'open', agent: '' }, p: { city: '', nb: '', rooms: '', max: '' }, d: { show: 'all', agent: '' } }; }
var F = freshFilters();

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function today() { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()); }
function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dm(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1]; }
function stamp() {
  var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return p.day + '/' + p.month + '/' + p.year + ' ' + p.hour + ':' + p.minute;
}
function digits(v) { return String(v || '').replace(/\D/g, ''); }
function waNum(v) { var d = digits(v); return d.charAt(0) === '0' ? '972' + d.slice(1) : d; }
function money(n) { return n ? '₪' + Number(n).toLocaleString('he-IL') : ''; }
function dueClass(d) { if (!d) return ''; var t = today(); return d < t ? 'late' : d === t ? 'now' : ''; }
function dueText(d) { if (!d) return ''; var t = today(); return d === t ? 'היום' : d === addDays(t, 1) ? 'מחר' : dm(d); }
function isAdmin() { return !!D.me && D.me.role === 'admin'; }
function agentName(id) { var a = D.agents.filter(function (x) { return x.id === id; })[0]; return a ? a.name : ''; }
function activeAgents() { return D.agents.filter(function (a) { return a.active; }); }
function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }).sort(function (x, y) { return String(x).localeCompare(String(y), 'he'); }); }

var tt;
function toast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2600); }

// ===== התחברות =====
function authCall(path, body) {
  return fetch(SB + '/auth/v1/' + path, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.msg || j.error_description || 'auth'); e.status = r.status; e.code = j.error_code || j.code; throw e; } return j; });
  });
}
function setSession(j) { S.at = j.access_token; S.exp = Date.now() + (j.expires_in - 60) * 1000; S.rt = j.refresh_token; S.uid = j.user && j.user.id; S.email = (j.user && j.user.email) || S.email; lsSet(RT_KEY, S.rt); }
function clearSession() { S.at = null; S.exp = 0; S.rt = null; S.uid = null; S.email = ''; lsSet(RT_KEY, null); lsSet(SIGN_KEY, null); }
var refreshing = null;
function refresh() {
  if (refreshing) return refreshing;
  refreshing = authCall('token?grant_type=refresh_token', { refresh_token: S.rt }).then(setSession).finally(function () { refreshing = null; });
  return refreshing;
}
function db(path, opt) {
  opt = opt || {};
  function go(retry) {
    var h = { apikey: KEY, Authorization: 'Bearer ' + S.at, 'Content-Type': 'application/json' };
    if (opt.prefer) h.Prefer = opt.prefer;
    return fetch(SB + '/rest/v1/' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined }).then(function (r) {
      if (r.status === 401 && retry && S.rt) return refresh().then(function () { return go(false); });
      return r.text().then(function (t) { if (!r.ok) { var e = new Error(t.slice(0, 200)); e.status = r.status; throw e; } return t ? JSON.parse(t) : null; });
    });
  }
  return (Date.now() > S.exp && S.rt ? refresh() : Promise.resolve()).then(function () { return go(true); });
}
function rpc(name, body) { return db('rpc/' + name, { method: 'POST', body: body || {} }); }
function api(action, body) {
  return (Date.now() > S.exp && S.rt ? refresh() : Promise.resolve()).then(function () {
    return fetch(SB + '/functions/v1/agent-api', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + S.at, 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action: action }, body || {})) });
  }).then(function (r) { return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error); return j; });
}

// ===== הודעה לגיליון שיש שינוי (אם נכשל, הגיליון מושך לבד כל 15 דקות) =====
var kt;
function sendKick() { try { fetch(SHEET_API, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: '{"op":"okick"}' }).catch(function () {}); } catch (e) {} }
function kick() { clearTimeout(kt); kt = setTimeout(function () { sendKick(); setTimeout(sendKick, 20000); }, 1500); }

// ===== טעינת נתונים =====
function loadAll() {
  return Promise.all([
    db('buyers?select=' + BUYER_COLS + '&order=id.desc'),
    db('tasks?select=' + TASK_COLS + '&order=id.desc&limit=800'),
    db('properties?select=id,deal,type,city,neighborhood,street,house_no,floor,rooms,sqm,price,prev_price,has_elevator,has_parking,has_mamad,source&status=eq.' + encodeURIComponent('פעיל') + '&order=id.desc'),
    isAdmin() ? db('agents?select=id,slug,name,phone,email,license,role,active&order=name.asc') : Promise.resolve([D.me]),
    isAdmin() ? db('agent_requests?select=id,email,name,phone,license,created_at&status=eq.pending&order=created_at.asc') : Promise.resolve([]),
    isAdmin() ? rpc('outbox_status').catch(function () { return null; }) : Promise.resolve(null),
    db('search_profiles?select=name,deal,rooms_min,rooms_max,budget,need_elevator,need_parking,need_mamad,neighborhoods,note'),
    db('portals?select=property_id,owner_name,excl_to,active,agent_id&active=is.true')
  ]).then(function (r) { D.buyers = r[0]; D.tasks = r[1]; D.props = r[2]; D.agents = r[3]; D.requests = r[4]; D.outbox = r[5]; D.profiles = r[6]; D.portals = r[7]; D.loadedAt = Date.now(); });
}
function enter() {
  app.innerHTML = '<div class="load">טוען…</div>';
  return db('agents?select=id,slug,name,phone,email,role,active&id=eq.' + S.uid).then(function (r) {

document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'q') { UI.q = e.target.value; UI.max = PAGE; drawBuyerList(); }
  else if (id === 'pq') { UI.pq = e.target.value; UI.pmax = PAGE; drawProps(); }
  else if (id === 'asq') { AS.q = e.target.value; AS.max = 80; drawAssign(); }
  else if (id === 'note') { UI.draft[cur().id] = e.target.value; }
});
document.addEventListener('change', function (e) {
  var id = e.target.id, k = e.target.dataset && e.target.dataset.flt, pk = e.target.dataset && e.target.dataset.pick, im = e.target.dataset && e.target.dataset.imp;
  if (id === 'impf' && e.target.files[0]) { readFile(e.target.files[0]).then(function (people) { if (!people.length) { toast('לא נמצאו קונים בקובץ'); return; } setImport(people); render(); }).catch(function () { toast('הקובץ לא נקרא. נסה קובץ אקסל, CSV או vcf.'); }); return; }
  if (im !== undefined && UI.imp) { UI.imp[+im].on = e.target.checked; render(); return; }
  if (pk) { var bid = cur().id, sel0 = UI.pick[bid] = UI.pick[bid] || {}; if (e.target.checked) sel0[pk] = 1; else delete sel0[pk]; render(); return; }
  if (e.target.dataset && e.target.dataset.passign) { var ppid = e.target.dataset.passign, pag = e.target.value; api('passign', { id: +ppid, agent_id: pag }).then(function () { var x = portalOf(ppid); if (x) x.agent_id = pag; toast('הנכס שויך אל ' + agentName(pag)); }).catch(function () { toast('השיוך נכשל. נסה שוב.'); render(); }); return; }
  if (id === 'asTo') { AS.to = e.target.value; drawAssign(); return; }
  if (e.target.dataset && e.target.dataset.as) { if (e.target.checked) AS.sel[e.target.dataset.as] = 1; else delete AS.sel[e.target.dataset.as]; drawAssign(); return; }
  if (k === 'as.who') { AS.who = e.target.value; AS.sel = {}; AS.max = 80; render(); return; }
  if (id === 'passign') { var pid = UI.portal.p.id, ag = e.target.value; api('passign', { id: +pid, agent_id: ag }).then(function () { var x = portalOf(pid); if (x) x.agent_id = ag; toast('הנכס שויך'); }).catch(function () { toast('השיוך נכשל. נסה שוב.'); render(); }); return; }
  if (k) { var p = k.split('.'); F[p[0]][p[1]] = e.target.value; if (k === 'p.city') F.p.nb = ''; UI.max = PAGE; UI.pmax = PAGE; render(); return; }
  if (id === 'next') patchBuyer(cur().id, { next_contact: e.target.value || null });
  else if (id === 'status') patchBuyer(cur().id, { status: e.target.value });
  else if (id === 'assign') patchBuyer(cur().id, { agent_id: e.target.value }, 'הקונה שויך');
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !D.me || Date.now() - D.loadedAt < 60000) return;
  loadAll().then(function () { var a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) render(); }).catch(function () {});
});

if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
S.rt = lsGet(RT_KEY);
if (S.rt) refresh().then(enter).catch(function (e) { if (e.status) { clearSession(); renderLogin(); } else enter(); });
else renderLogin();
})();
</script>
</body>
</html>
