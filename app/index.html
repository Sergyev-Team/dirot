<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16191F">
<title>משרד סרגייב</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../f/app180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#F4F3EE;--surface:#fff;--fg:#16191F;--muted:#5F646C;--line:#E1E3DD;--gold:#A9802F;--gold-ink:#7E5E1E;--gold-soft:#F5EEDD;--ok:#17744A;--bad:#A62B2B;--bad-soft:#FBEDEC;--on-gold:#fff;--font:"Assistant","Arial Hebrew",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--surface:#1A1D23;--fg:#F0EEE8;--muted:#A9ADB5;--line:#2D3138;--gold:#D5A84A;--gold-ink:#E2BC6C;--gold-soft:#2B2517;--ok:#4FBF8B;--bad:#F0908A;--bad-soft:#35201F;--on-gold:#16191F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111317;--surface:#1A1D23;--fg:#F0EEE8;--muted:#A9ADB5;--line:#2D3138;--gold:#D5A84A;--gold-ink:#E2BC6C;--gold-soft:#2B2517;--ok:#4FBF8B;--bad:#F0908A;--bad-soft:#35201F;--on-gold:#16191F;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:inherit}
.page{max-width:680px;margin:0 auto;padding:18px 16px calc(92px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:44px}
.head-acts{display:flex;align-items:center;gap:4px;flex:none}
h1{font-size:25px;line-height:1.2;margin:0;font-weight:700}
h2{font-size:15px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.bad{color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.btn.link{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 8px;min-height:40px}
.btn:disabled{opacity:.55;cursor:default}
.count{display:inline-block;min-width:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:13px;line-height:20px;text-align:center}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{width:100%;min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.in{min-height:84px;resize:vertical;display:block}
.ltr{direction:ltr;text-align:right}
.flts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.flt span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:2px}
.flt select{min-height:42px;padding:6px 8px;font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;margin-bottom:6px}
.bar .sub{margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:62px;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:right;text-decoration:none}
.row:last-child{border-bottom:0}
.row .main{min-width:0;flex:1}
.row b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{flex:none;font-size:15px;color:var(--muted);text-align:left}
.late{color:var(--bad);font-weight:700}
.now{color:var(--gold-ink);font-weight:700}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink);direction:ltr}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat{padding:12px 8px;text-align:center;background:none;border:0;border-inline-start:1px solid var(--line);text-decoration:none}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font-size:26px;line-height:1.15}
.stat span{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 10px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:5px 13px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;background:none;border:0;border-inline-start:1px solid var(--line);font-weight:700;font-size:15px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card>h2:first-child{margin-top:0}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.quick .btn{padding:5px 9px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{padding:8px 0;border-bottom:1px solid var(--line);font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.note:last-child{border-bottom:0;padding-bottom:0}
.empty{padding:22px 14px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.alert{padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:600;margin-bottom:12px;font-size:15px}
.task{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);background:none;padding:0;display:grid;place-items:center;color:var(--on-gold)}
.check[aria-pressed="true"]{background:var(--gold)}
.task .main{flex:1;min-width:0}
.task .txt{overflow-wrap:anywhere}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task small{color:var(--muted);font-size:14px}
.x{flex:none;width:40px;height:40px;background:none;border:0;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.add .t{grid-column:1/-1}
.price{font-size:24px;font-weight:700;margin:6px 0 10px}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.spec{padding:3px 9px;border-radius:7px;background:var(--bg);font-size:15px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px}
.kv span{color:var(--muted)}
.person{padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0;padding-bottom:0}
.person:first-of-type{padding-top:0}
.person b{display:block}
.person small{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.person .acts{margin:10px 0 0}
.nav{position:fixed;inset:auto 0 0 0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.nav a[aria-current="page"]{color:var(--gold-ink)}
.nav svg,.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px 0 10px;margin-inline-start:-4px;background:none;border:0;color:var(--muted);font-weight:600;text-decoration:none}
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.login img{display:block;height:64px;margin:0 auto 18px;background:#fff;border-radius:8px;padding:3px 8px}
.login h1{margin-bottom:4px}
.login p{color:var(--muted);margin:0 0 18px}
.code{font-size:26px;font-weight:700;letter-spacing:5px;text-align:center;direction:ltr}
.err{color:var(--bad);font-weight:600;font-size:15px;margin:0 0 12px}
.toast{position:fixed;z-index:9;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;padding:11px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:600;text-align:center}
.load{padding:60px 0;text-align:center;color:var(--muted)}
.more{margin-top:10px}
</style>
</head>
<body>
<div id="app"><div class="load">טוען…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
'use strict';
var SB = 'https://zqpgzcgvvhaokaimedio.supabase.co';
var KEY = 'sb_publishable_pHWmO4yjoVO3CvkNUE8u3g_spxQJHib';
var SHEET_API = 'https://script.google.com/macros/s/AKfycbxSon5hLywrAVGN2OGTQFec5uNZpkzgI243GnyBu230r1Sj5ErPJXXX414v9Tsl6UnC/exec';
var SITE = 'https://sergeyev-team.com/';
var RT_KEY = 'sg_app_rt', SIGN_KEY = 'sergyev_agent_code';
var PAGE = 60, TZ = 'Asia/Jerusalem';
var BUYER_COLS = 'id,agent_id,name,phone,phone9,profile_name,rating,notes,status,last_contact,next_contact,sheet_id,created_at';
var TASK_COLS = 'id,agent_id,due,text,ref,ref_label,done,done_at,created_at';
var INTERVAL = { 'A++': 3, 'A+': 7, 'A': 14 };

var app = document.getElementById('app');
var S = { at: null, exp: 0, rt: null, uid: null, email: '' };
var D = { me: null, buyers: [], tasks: [], props: [], agents: [], requests: [], outbox: null, signCode: null, loadedAt: 0 };
var UI = { q: '', max: PAGE, pq: '', deal: 'מכירה', pmax: PAGE, draft: {}, login: { step: 'email', email: '', err: '', busy: false } };
function freshFilters() { return { b: { status: 'active', due: '', rate: '', agent: '' }, t: { view: 'open', agent: '' }, p: { city: '', nb: '', rooms: '', max: '' }, d: { show: 'all', agent: '' } }; }
var F = freshFilters();

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function today() { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()); }
function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dm(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1]; }
function stamp() {
  var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return p.day + '/' + p.month + '/' + p.year + ' ' + p.hour + ':' + p.minute;
}
function digits(v) { return String(v || '').replace(/\D/g, ''); }
function waNum(v) { var d = digits(v); return d.charAt(0) === '0' ? '972' + d.slice(1) : d; }
function money(n) { return n ? '₪' + Number(n).toLocaleString('he-IL') : ''; }
function dueClass(d) { if (!d) return ''; var t = today(); return d < t ? 'late' : d === t ? 'now' : ''; }
function dueText(d) { if (!d) return ''; var t = today(); return d === t ? 'היום' : d === addDays(t, 1) ? 'מחר' : dm(d); }
function isAdmin() { return !!D.me && D.me.role === 'admin'; }
function agentName(id) { var a = D.agents.filter(function (x) { return x.id === id; })[0]; return a ? a.name : ''; }
function activeAgents() { return D.agents.filter(function (a) { return a.active; }); }
function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }).sort(function (x, y) { return String(x).localeCompare(String(y), 'he'); }); }

var tt;
function toast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2600); }

// ===== התחברות =====
function authCall(path, body) {
  return fetch(SB + '/auth/v1/' + path, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.msg || j.error_description || 'auth'); e.status = r.status; e.code = j.error_code || j.code; throw e; } return j; });
  });
}
function setSession(j) { S.at = j.access_token; S.exp = Date.now() + (j.expires_in - 60) * 1000; S.rt = j.refresh_token; S.uid = j.user && j.user.id; S.email = (j.user && j.user.email) || S.email; lsSet(RT_KEY, S.rt); }
function clearSession() { S.at = null; S.exp = 0; S.rt = null; S.uid = null; S.email = ''; lsSet(RT_KEY, null); lsSet(SIGN_KEY, null); }
var refreshing = null;
function refresh() {
  if (refreshing) return refreshing;
  refreshing = authCall('token?grant_type=refresh_token', { refresh_token: S.rt }).then(setSession).finally(function () { refreshing = null; });
  return refreshing;
}
function db(path, opt) {
  opt = opt || {};
  function go(retry) {
    var h = { apikey: KEY, Authorization: 'Bearer ' + S.at, 'Content-Type': 'application/json' };
    if (opt.prefer) h.Prefer = opt.prefer;
    return fetch(SB + '/rest/v1/' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined }).then(function (r) {
      if (r.status === 401 && retry && S.rt) return refresh().then(function () { return go(false); });
      return r.text().then(function (t) { if (!r.ok) { var e = new Error(t.slice(0, 200)); e.status = r.status; throw e; } return t ? JSON.parse(t) : null; });
    });
  }
  return (Date.now() > S.exp && S.rt ? refresh() : Promise.resolve()).then(function () { return go(true); });
}
function rpc(name, body) { return db('rpc/' + name, { method: 'POST', body: body || {} }); }

// ===== הודעה לגיליון שיש שינוי (אם נכשל, הגיליון מושך לבד כל 15 דקות) =====
var kt;
function sendKick() { try { fetch(SHEET_API, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: '{"op":"okick"}' }).catch(function () {}); } catch (e) {} }
function kick() { clearTimeout(kt); kt = setTimeout(function () { sendKick(); setTimeout(sendKick, 20000); }, 1500); }

// ===== טעינת נתונים =====
function loadAll() {
  return Promise.all([
    db('buyers?select=' + BUYER_COLS + '&order=id.desc'),
    db('tasks?select=' + TASK_COLS + '&order=id.desc&limit=800'),
    db('properties?select=id,deal,type,city,neighborhood,street,house_no,floor,rooms,sqm,price,prev_price,has_elevator,has_parking,has_mamad,source&status=eq.' + encodeURIComponent('פעיל') + '&order=id.desc'),
    isAdmin() ? db('agents?select=id,slug,name,phone,email,license,role,active&order=name.asc') : Promise.resolve([D.me]),
    isAdmin() ? db('agent_requests?select=id,email,name,phone,license,created_at&status=eq.pending&order=created_at.asc') : Promise.resolve([]),
    isAdmin() ? rpc('outbox_status').catch(function () { return null; }) : Promise.resolve(null)
  ]).then(function (r) { D.buyers = r[0]; D.tasks = r[1]; D.props = r[2]; D.agents = r[3]; D.requests = r[4]; D.outbox = r[5]; D.loadedAt = Date.now(); });
}
function enter() {
  app.innerHTML = '<div class="load">טוען…</div>';
  return db('agents?select=id,slug,name,phone,email,role,active&id=eq.' + S.uid).then(function (r) {
    D.me = r && r[0] && r[0].active ? r[0] : null;
    if (!D.me) return accessScreen();
    return rpc('my_sign_code').catch(function () { return null; }).then(function (code) {
      D.signCode = code || null;
      if (D.signCode && !isAdmin()) lsSet(SIGN_KEY, D.signCode);
      return loadAll().then(render);
    });
  }).catch(function (e) {
    if (e.status === 400 || e.status === 401 || e.status === 403) { clearSession(); UI.login.step = 'email'; renderLogin(); return; }
    message('אין חיבור', 'בדוק את האינטרנט ונסה שוב.', '<button class="btn pri wide" type="button" data-act="retry">נסה שוב</button>');
  });
}
function message(title, text, buttons) { app.innerHTML = '<div class="login"><form onsubmit="return false"><img src="../s/logo.jpg" alt="צוות סרגייב"><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' + buttons + '</form></div>'; }
var OUT_BTN = '<button class="btn link wide" type="button" data-act="logout">יציאה</button>';
function accessScreen() {
  return db('agent_requests?select=status&id=eq.' + S.uid).then(function (r) {
    var st = r && r[0] && r[0].status;
    if (!st) return requestForm();
    if (st === 'pending') return message('הבקשה ממתינה לאישור', 'משה יאשר את החשבון שלך, ואז תוכל להיכנס למערכת.', '<button class="btn pri wide" type="button" data-act="retry">בדיקה אם אושרתי</button>' + OUT_BTN);
    if (st === 'rejected') return message('הבקשה לא אושרה', 'לפרטים נוספים פנה למנהל המשרד.', OUT_BTN);
    message('החשבון הושבת', 'לפרטים נוספים פנה למנהל המשרד.', OUT_BTN);
  });
}
function requestForm() {
  app.innerHTML = '<div class="login"><form data-form="request"><img src="../s/logo.jpg" alt="צוות סרגייב"><h1>בקשת הצטרפות</h1><p>מלא את הפרטים. החשבון ייפתח אחרי אישור של משה.</p>' +
    '<label class="field"><span>שם מלא</span><input class="in" id="rn" required maxlength="80" autocomplete="name"></label>' +
    '<label class="field"><span>טלפון</span><input class="in ltr" id="rp" type="tel" inputmode="tel" required autocomplete="tel"></label>' +
    '<label class="field"><span>מספר רישיון תיווך</span><input class="in ltr" id="rl" inputmode="numeric" required maxlength="20"></label>' +
    '<label class="field"><span>תעודת זהות (להסכמי תיווך)</span><input class="in ltr" id="ri" inputmode="numeric" required maxlength="9"></label>' +
    '<button class="btn pri wide" type="submit">שליחת בקשה</button>' + OUT_BTN + '</form></div>';
}

// ===== מסך כניסה =====
function renderLogin() {
  var L = UI.login, err = L.err ? '<p class="err" role="alert">' + esc(L.err) + '</p>' : '';
  if (L.step === 'email') {
    app.innerHTML = '<div class="login"><form data-form="email"><img src="../s/logo.jpg" alt="צוות סרגייב"><h1>כניסה למשרד</h1><p>נשלח לך קוד כניסה למייל.</p>' + err +
      '<label class="field"><span>מייל</span><input class="in ltr" id="em" type="email" inputmode="email" autocomplete="email" required value="' + esc(L.email) + '"></label>' +
      '<button class="btn pri wide" type="submit"' + (L.busy ? ' disabled' : '') + '>' + (L.busy ? 'שולח…' : 'שליחת קוד') + '</button></form></div>';
    return;
  }
  app.innerHTML = '<div class="login"><form data-form="code"><img src="../s/logo.jpg" alt="צוות סרגייב"><h1>הזן את הקוד</h1><p>שלחנו קוד אל <span dir="ltr">' + esc(L.email) + '</span></p>' + err +

  var prices = UI.deal === 'השכרה' ? [4000, 5000, 6000, 8000, 10000] : [1500000, 2000000, 2500000, 3000000, 4000000];
  return '<main class="page"><div class="head"><h1>נכסים</h1></div><input class="in" id="pq" type="search" placeholder="חיפוש לפי רחוב, מספר נכס או מתווך" aria-label="חיפוש נכסים" value="' + esc(UI.pq) + '">' +
    chips('deal', [['מכירה', 'מכירה'], ['השכרה', 'השכרה']], UI.deal, 'סוג עסקה') +
    '<div class="flts">' + sel('p.city', 'עיר', [['', 'כל הערים']].concat(cities.map(function (c) { return [c, c]; })), f.city) + sel('p.nb', 'שכונה', [['', 'כל השכונות']].concat(nbs.map(function (c) { return [c, c]; })), f.nb) +
    sel('p.rooms', 'חדרים', [['', 'הכול'], ['2', '2 ומעלה'], ['3', '3 ומעלה'], ['4', '4 ומעלה'], ['5', '5 ומעלה']], f.rooms) + sel('p.max', 'מחיר עד', [['', 'ללא הגבלה']].concat(prices.map(function (n) { return [n, money(n)]; })), f.max) + '</div><div id="plist"></div></main>' + nav('props');
}
function vProp(id) {
  var p = propById(id);
  if (!p) return '<main class="page"><a class="back" href="#props">חזרה לנכסים</a><div class="empty">הנכס לא נמצא.</div></main>' + nav('props');
  var s = p.source || {}, specs = propSpec(p).concat([p.has_elevator ? 'מעלית' : '', p.has_parking ? 'חניה' : '', p.has_mamad ? 'ממ״ד' : '', s.balcony && s.balcony !== 'לא' ? 'מרפסת' : '', s.condition || '']).filter(Boolean);
  var page = SITE + 'd/' + p.id + '.html', share = 'https://wa.me/?text=' + encodeURIComponent(propAddr(p) + ', ' + (p.city || '') + '\n' + page), phone = digits(s.broker_phone);
  return '<main class="page"><a class="back" href="#props">חזרה לנכסים</a><h1>' + esc(propAddr(p)) + '</h1><p class="sub">' + esc([p.neighborhood, p.city].filter(Boolean).join(', ')) + ' · נכס #' + p.id + '</p><div class="price">' + esc(money(p.price)) + '</div>' +
    '<div class="specs">' + specs.map(function (x) { return '<span class="spec">' + esc(x) + '</span>'; }).join('') + '</div>' +
    '<div class="acts"><a class="btn pri" href="' + esc(share) + '" target="_blank" rel="noopener">שליחה ללקוח</a><a class="btn" href="../d/' + p.id + '.html" target="_blank" rel="noopener">דף הנכס</a></div>' +
    '<div class="card"><h2>מתווך או מפרסם</h2><div class="kv"><span>שם</span><b>' + esc(s.broker || 'לא צוין') + '</b></div>' + (phone ? '<div class="kv"><span>טלפון</span><b dir="ltr">' + esc(s.broker_phone) + '</b></div><div class="acts" style="margin-bottom:0"><a class="btn" href="tel:' + esc(phone) + '">התקשר</a><button class="btn" type="button" data-act="copy" data-v="' + esc(s.broker_phone) + '">העתקת מספר</button></div>' : '') + (s.last_post ? '<div class="kv"><span>פורסם לאחרונה</span><b>' + esc(dm(s.last_post)) + '</b></div>' : '') + '</div></main>' + nav('props');
}

// ===== צוות (מנהל) =====
function vTeam() {
  var roles = { admin: 'מנהל ראשי', manager: 'מנהל', agent: 'סוכן' };
  var reqs = D.requests.map(function (r) {
    return '<div class="person"><b>' + esc(r.name) + '</b><small dir="ltr" style="text-align:right">' + esc(r.email) + '</small><small dir="ltr" style="text-align:right">' + esc(r.phone) + '</small>' + (r.license ? '<small>רישיון ' + esc(r.license) + '</small>' : '') +
      '<div class="acts"><button class="btn pri" type="button" data-act="approve" data-id="' + esc(r.id) + '">אישור</button><button class="btn bad" type="button" data-act="reject" data-id="' + esc(r.id) + '">דחייה</button></div></div>';
  }).join('');
  var team = D.agents.map(function (a) {
    return '<div class="person"><b>' + esc(a.name) + (a.active ? '' : ' (מושבת)') + '</b><small>' + esc(roles[a.role] || a.role) + '</small><small dir="ltr" style="text-align:right">' + esc(a.email || '') + '</small>' +
      (a.id !== D.me.id ? '<div class="quick"><button class="btn sm' + (a.active ? ' bad' : '') + '" type="button" data-act="toggleAgent" data-id="' + esc(a.id) + '">' + (a.active ? 'השבתת חשבון' : 'הפעלת חשבון') + '</button></div>' : '') + '</div>';
  }).join('');
  return '<main class="page"><a class="back" href="#today">חזרה</a><h1 style="margin-bottom:14px">צוות</h1><div class="card"><h2>בקשות ממתינות</h2>' + (reqs || '<p class="sub">אין בקשות חדשות.</p>') + '</div><div class="card"><h2>חשבונות</h2>' + team + '</div></main>' + nav('today');
}

function route() { return (location.hash || '#today').slice(1); }
function render() {
  if (!D.me) return;
  var r = route(), y = window.scrollY, same = render.last === r;
  if (r.indexOf('b/') === 0) app.innerHTML = vBuyer(r.slice(2));
  else if (r.indexOf('p/') === 0) app.innerHTML = vProp(r.slice(2));
  else if (r === 'new') app.innerHTML = vNew();
  else if (r === 'buyers') { app.innerHTML = vBuyers(); drawBuyerList(); }
  else if (r === 'tasks') app.innerHTML = vTasks();
  else if (r === 'props') { app.innerHTML = vProps(); drawProps(); }
  else if (r === 'team' && isAdmin()) app.innerHTML = vTeam();
  else app.innerHTML = vToday();
  render.last = r; window.scrollTo(0, same ? y : 0);
}

// ===== פעולות =====
function cur() { var m = document.querySelector('[data-b]'); return byId(m.dataset.b); }
function teamAction(call, msg) { return call.then(function () { sendKick(); return loadAll(); }).then(function () { render(); toast(msg); }).catch(function () { toast('הפעולה נכשלה. נסה שוב.'); }); }
var ACT = {
  retry: function () { enter(); },
  logout: function () { var at = S.at; clearSession(); D.me = null; F = freshFilters(); UI.login = { step: 'email', email: '', err: '', busy: false }; if (at) fetch(SB + '/auth/v1/logout', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + at } }).catch(function () {}); location.hash = ''; renderLogin(); },
  otherMail: function () { UI.login.step = 'email'; UI.login.err = ''; renderLogin(); },
  sign: function (el, e) { if (!isAdmin() && !D.signCode) { e.preventDefault(); toast('חשבון ההחתמות בהכנה. נסה שוב בעוד דקה.'); } },
  chip: function (el) { var k = el.dataset.k, v = el.dataset.v; if (k === 'deal') { UI.deal = v; F.p = { city: '', nb: '', rooms: '', max: '' }; UI.pmax = PAGE; } else { var p = k.split('.'); F[p[0]][p[1]] = v; UI.max = PAGE; } render(); },
  filterDue: function () { F.b = { status: 'active', due: 'due', rate: '', agent: F.d.agent }; UI.q = ''; UI.max = PAGE; },
  filterActive: function () { F.b = { status: 'active', due: '', rate: '', agent: F.d.agent }; UI.q = ''; UI.max = PAGE; },
  filterOpen: function () { F.t = { view: 'open', agent: F.d.agent }; },
  clearBuyers: function () { F.b = freshFilters().b; UI.q = ''; UI.max = PAGE; render(); },
  clearProps: function () { F.p = freshFilters().p; UI.pq = ''; UI.pmax = PAGE; render(); },
  moreBuyers: function () { UI.max += PAGE; drawBuyerList(); },
  moreProps: function () { UI.pmax += PAGE; drawProps(); },
  rate: function (el) { var b = cur(); patchBuyer(b.id, { rating: b.rating === el.dataset.v ? null : el.dataset.v }); },
  nextIn: function (el) { patchBuyer(cur().id, { next_contact: addDays(today(), +el.dataset.n) }); },
  nextClear: function () { patchBuyer(cur().id, { next_contact: null }); },
  outcome: function (el) {
    var b = cur(), k = el.dataset.k, t = today(), iv = INTERVAL[b.rating || ''] || 30, f = {};
    if (k === 'ans' || k === 'sent') { f.last_contact = t; f.next_contact = addDays(t, iv); }
    if (k === 'noans') f.next_contact = addDays(t, 1);
    if (k === 'irr') f.next_contact = addDays(t, 60);
    f.notes = withNote(b, { ans: 'ענה', sent: 'שלחתי דירות', noans: 'לא ענה', irr: 'לא רלוונטי כרגע' }[k]);
    patchBuyer(b.id, f, 'עודכן. חזרה ב-' + dm(f.next_contact));
  },
  addNote: function () {
    var b = cur(), el = document.getElementById('note'), v = el.value.trim(); if (!v) { el.focus(); return; }
    delete UI.draft[b.id]; patchBuyer(b.id, { notes: withNote(b, v.replace(/\s*\n\s*/g, ' ')) }, 'ההערה נשמרה');
  },
  copy: function (el) { var v = el.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('המספר הועתק'); }).catch(function () { toast(v); }); },
  toggleTask: function (el) {
    var t = taskById(el.dataset.id); if (!t) return;
    var old = { done: t.done, done_at: t.done_at }, f = { done: !t.done, done_at: t.done ? null : new Date().toISOString() }; Object.assign(t, f); render();
    db('tasks?id=eq.' + t.id, { method: 'PATCH', body: f, prefer: 'return=minimal' }).then(kick).catch(function () { Object.assign(t, old); render(); toast('לא נשמר. נסה שוב.'); });
  },
  delTask: function (el) {
    var t = taskById(el.dataset.id); if (!t || !confirm('למחוק את המשימה?')) return;
    var all = D.tasks; D.tasks = all.filter(function (x) { return x !== t; }); render();
    db('tasks?id=eq.' + t.id, { method: 'DELETE', prefer: 'return=minimal' }).then(function () { toast('המשימה נמחקה'); kick(); }).catch(function () { D.tasks = all; render(); toast('לא נמחק. נסה שוב.'); });
  },
  approve: function (el) { teamAction(rpc('approve_agent', { p_id: el.dataset.id }), 'החשבון אושר'); },
  reject: function (el) { if (confirm('לדחות את הבקשה?')) teamAction(rpc('reject_agent', { p_id: el.dataset.id }), 'הבקשה נדחתה'); },
  toggleAgent: function (el) {
    var a = D.agents.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!a) return;
    if (a.active && !confirm('להשבית את החשבון של ' + a.name + '?')) return;
    teamAction(rpc('set_agent_active', { p_id: a.id, p_active: !a.active }), a.active ? 'החשבון הושבת' : 'החשבון הופעל');
  }
};
var FORM = {
  email: function () {
    var L = UI.login; L.email = document.getElementById('em').value.trim().toLowerCase(); L.busy = true; L.err = ''; renderLogin();
    authCall('otp', { email: L.email, create_user: true }).then(function () { L.step = 'code'; }).catch(function (e) { L.err = loginErr(e); }).finally(function () { L.busy = false; renderLogin(); });
  },
  code: function () {
    var L = UI.login, token = digits(document.getElementById('cd').value); L.busy = true; L.err = ''; renderLogin();
    authCall('verify', { type: 'email', email: L.email, token: token }).then(function (j) { setSession(j); L.busy = false; if (!location.hash) location.hash = '#today'; return enter(); }).catch(function (e) { L.busy = false; L.err = loginErr(e); renderLogin(); });
  },
  request: function () {
    var v = function (id) { return document.getElementById(id).value.trim(); }, phone = digits(v('rp')), idn = digits(v('ri'));
    if (phone.length < 9 || phone.length > 12) { toast('בדוק את מספר הטלפון'); return; }
    if (idn.length < 8 || idn.length > 9) { toast('בדוק את תעודת הזהות'); return; }
    db('agent_requests', { method: 'POST', body: { id: S.uid, email: S.email, name: v('rn'), phone: phone, license: v('rl'), id_number: idn }, prefer: 'return=minimal' }).then(function () { sendKick(); return enter(); }).catch(function () { toast('הבקשה לא נשלחה. נסה שוב.'); });
  },
  newBuyer: function () {
    var name = document.getElementById('nn').value.trim(), phone = digits(document.getElementById('np').value), note = document.getElementById('nt').value.trim(), na = document.getElementById('na');
    if (phone.length < 9 || phone.length > 12) { toast('בדוק את מספר הטלפון'); return; }
    var p9 = phone.slice(-9), dup = D.buyers.filter(function (b) { return digits(b.phone).slice(-9) === p9; })[0];
    if (dup) { toast('הקונה כבר קיים'); location.hash = '#b/' + dup.id; return; }
    var body = { agent_id: na ? na.value : D.me.id, name: name, phone: phone, status: 'פעיל', last_contact: today(), source: 'app', notes: note ? stamp() + ' – ' + note.replace(/\s*\n\s*/g, ' ') : null };
    db('buyers?select=' + BUYER_COLS, { method: 'POST', body: body, prefer: 'return=representation' }).then(function (r) { D.buyers.unshift(r[0]); toast('הקונה נוסף'); kick(); location.hash = '#b/' + r[0].id; }).catch(function () { toast('לא נשמר. נסה שוב.'); });
  },
  newTask: function () {
    var text = document.getElementById('tt').value.trim(), due = document.getElementById('td').value || null, ta = document.getElementById('ta'); if (!text) return;
    var body = { text: text, due: due }; if (ta) body.agent_id = ta.value;
    db('tasks?select=' + TASK_COLS, { method: 'POST', body: body, prefer: 'return=representation' }).then(function (r) { D.tasks.unshift(r[0]); F.t.view = 'open'; render(); toast('המשימה נוספה'); kick(); }).catch(function () { toast('לא נשמר. נסה שוב.'); });
  }
};

document.addEventListener('click', function (e) { var el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('submit', function (e) { var f = e.target.closest('[data-form]'); if (f) { e.preventDefault(); FORM[f.dataset.form](); } });
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'q') { UI.q = e.target.value; UI.max = PAGE; drawBuyerList(); }
  else if (id === 'pq') { UI.pq = e.target.value; UI.pmax = PAGE; drawProps(); }
  else if (id === 'note') { UI.draft[cur().id] = e.target.value; }
});
document.addEventListener('change', function (e) {
  var id = e.target.id, k = e.target.dataset && e.target.dataset.flt;
  if (k) { var p = k.split('.'); F[p[0]][p[1]] = e.target.value; if (k === 'p.city') F.p.nb = ''; UI.max = PAGE; UI.pmax = PAGE; render(); return; }
  if (id === 'next') patchBuyer(cur().id, { next_contact: e.target.value || null });
  else if (id === 'status') patchBuyer(cur().id, { status: e.target.value });
  else if (id === 'assign') patchBuyer(cur().id, { agent_id: e.target.value }, 'הקונה שויך');
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !D.me || Date.now() - D.loadedAt < 60000) return;
  loadAll().then(function () { var a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) render(); }).catch(function () {});
});

S.rt = lsGet(RT_KEY);
if (S.rt) refresh().then(enter).catch(function (e) { if (e.status) { clearSession(); renderLogin(); } else enter(); });
else renderLogin();
})();
</script>
</body>
</html>
