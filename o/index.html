 const RQ=(P.reqs||[]),CAL=P.cal||{next:[]},V=P.views||{},MT=P.match||{buyers:0};
 const cnt={};ev.forEach(e=>cnt[e.ch]=(cnt[e.ch]||0)+(e.ch==="tour"?(e.n||1):1));
 const tours=cnt.tour||0,offers=ev.filter(e=>e.ch==="offer").length,leads=cnt.lead||0;
 const days=start?Math.max(1,Math.ceil((now-start)/DAY)):0;
 const addr=L?(L.street+" "+L.hn+", "+L.city):"נכס #"+p.id,img=L&&L.imgs&&L.imgs[0]?"../"+L.imgs[0]:"";
 const reqH=RQ.filter(r=>r.st==="pending").map(r=>`<div class="card rq" data-row="${r.row}"><h2>${r.type==="tourplan"?"📅 בקשה לאישור סיור":"🔻 הצעה לעדכון מחיר"}</h2>
  <p style="margin:4px 0"><b>${r.type==="tourplan"?E(r.data.when?new Date(dt(r.data.when)).toLocaleString("he-IL",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):""):"מחיר חדש מוצע: "+E(fm(r.data.price))}</b></p>${r.text?`<p class="hint" style="margin:0 0 6px">${E(r.text)}</p>`:""}
  <textarea placeholder="הערה (לא חובה)" style="min-height:56px"></textarea><div class="row"><button class="btn gold" data-a="yes">${r.type==="tourplan"?"מאשר/ת את הסיור":"מאשר/ת את המחיר"}</button><button class="btn gh" data-a="no">${r.type==="tourplan"?"לא מתאים":"לא מאשר/ת"}</button></div></div>`).join("")
  +RQ.filter(r=>r.st!=="pending").slice(-3).reverse().map(r=>`<p class="hint">${r.type==="tourplan"?"סיור":"עדכון מחיר"} ${r.type==="pricereq"?E(fm(r.data.price)):""}: <span class="${r.st==="approved"?"ok":"no"}">${r.st==="approved"?"אישרתם":"דחיתם"}</span></p>`).join("");
 const MED=(P.log||[]).filter(x=>x.type==="media"&&x.data&&x.data.fid).reverse();
 const mediaH=MED.length?`<h2>חומרי השיווק של הנכס</h2><div class="card"><div class="med">${MED.map(m=>m.data.kind==="reel"?`<iframe src="https://drive.google.com/file/d/${E(m.data.fid)}/preview" allow="autoplay" loading="lazy" title="רילס"></iframe>`:`<a href="https://drive.google.com/file/d/${E(m.data.fid)}/view" target="_blank" rel="noopener"><img src="https://drive.google.com/thumbnail?id=${E(m.data.fid)}&sz=w1000" alt="פלייר" loading="lazy"></a>`).join("")}</div></div>`:"";
 const W=[3,2,1,0].map(w=>{const a=now-(w+1)*7*DAY,b=now-w*7*DAY,c={};ev.forEach(e=>{if(e.ts>a&&e.ts<=b&&e.type!=="start")c[e.ch]=(c[e.ch]||0)+1});return {w,c,n:Object.values(c).reduce((s,x)=>s+x,0)}}),mx=Math.max(1,...W.map(w=>w.n));
 const chartH=`<div class="chart" role="img" aria-label="פעולות שיווק לפי שבועות">${W.map(w=>`<div class="wk"><em>${w.n}</em><div class="stack" style="height:${Math.max(2,w.n/mx*82)}%">${CHORD.filter(k=>w.c[k]).map(k=>`<i style="flex:${w.c[k]};background:${CH[k].c}"></i>`).join("")}</div><small>${w.w?(w.w===1?"לפני שבוע":"לפני "+w.w+" שבועות"):"השבוע"}</small></div>`).join("")}</div><div class="legend">${CHORD.filter(k=>cnt[k]).map(k=>`<span style="--c:${CH[k].c}">${CH[k].n}</span>`).join("")}</div>`;
 const nextH=(CAL.next||[]).length?`<h2>פגישות קרובות בנכס</h2><div class="card">${CAL.next.map(d=>{const t=dt(d),x=new Date(t);return `<div class="next"><div class="cal"><b>${x.getDate()}</b>${E(x.toLocaleDateString("he-IL",{month:"short"}))}</div><div><b>${E(x.toLocaleDateString("he-IL",{weekday:"long"}))}, ${E(heT(t))}</b><div class="hint">סיור עם קונה מתעניין</div></div></div>`}).join("")}</div>`:"";
 const ms=(P.msgs||[]).map(m=>`<div class="msg ${m.from==="בעלים"?"me":"of"}">${E(m.text)}<small>${m.from==="בעלים"?"אתם":E(P.broker.name)} · ${E(new Date(dt(m.d)).toLocaleDateString("he-IL"))}</small></div>`).join("");
 const wa="https://wa.me/972"+String(P.broker.phone).replace(/\D/g,"").replace(/^0/,"")+"?text="+encodeURIComponent("שלום, אני "+(p.name||"")+" – בעל/ת הנכס ב"+addr);
 const spec=L?[L.rooms?L.rooms+" חדרים":"",L.sqm?L.sqm+" מ״ר":"",L.floor!==""&&L.floor!=null?"קומה "+L.floor:""].filter(Boolean).join(" · "):"";
 $("#app").innerHTML=`<header class="hero" style="${img?`background-image:url('${E(img)}')`:""}"><div class="top"><img src="logo.jpg" alt="צוות סרגייב"><small><a href="#" id="lo">יציאה</a></small></div>
  <div class="hi"><p>שלום ${E(p.name||"")}, זה הדוח החי של הנכס שלכם</p><h1>${E(addr)}</h1><div class="meta">${E(spec)}</div></div></header>
 <section class="sheet"><div class="dayrow"><b>${days?"יום "+days+" בשיווק":"מתחילים לשווק"}</b>${L&&L.price?`<span class="price">${E(fm(L.price))}</span>`:""}</div>
  <div class="k4"><div><b>${V.total||0}</b><span>צפיות בדף הנכס</span>${V.w7?`<i>+${V.w7} השבוע</i>`:""}</div><div><b>${leads}</b><span>פניות של קונים</span></div><div><b>${tours}</b><span>קונים בסיורים</span></div><div><b>${offers}</b><span>הצעות מחיר</span></div></div>
  ${MT.buyers?`<div class="match"><b>${MT.buyers}</b><p>קונים פעילים במאגר שלנו מחפשים בדיוק נכס כזה, והנכס נשלח לכל אחד מהם אישית.</p></div>`:""}
  ${L?`<div class="row" style="margin:0 0 10px"><a class="btn gh" href="../d/${E(p.id)}.html" target="_blank" rel="noopener">לדף הנכס באתר</a></div>`:""}</section>
 ${reqH?`<h2>מחכה לאישור שלכם</h2>${reqH}`:""}
 ${nextH}
 <h2>הפעילות לפי שבועות</h2><div class="card">${chartH}</div>
 ${mediaH}
 <h2>כל מה שעשינו</h2><nav class="chips" id="cp" aria-label="סינון לפי ערוץ"></nav><ul class="feed" id="fd"></ul>
 <h2>כתבו לנו</h2><div class="card">${ms||'<p class="hint" style="margin-top:0">יש לכם הערה, שאלה או עדכון לגבי הנכס? כתבו כאן ונחזור אליכם.</p>'}
  <textarea id="tx" placeholder="כתבו הודעה…" aria-label="הודעה"></textarea><div class="row"><button class="btn" id="snd">שליחה</button><a class="btn wa" href="${E(wa)}" target="_blank" rel="noopener">וואטסאפ ל${E(P.broker.name.split(" ")[0])}</a></div><p class="hint" id="st"></p></div>
 ${p.pdf?`<h2>מסמכים</h2><div class="card"><a class="btn gh" href="${E(p.pdf)}" target="_blank" rel="noopener">ההסכם החתום (PDF)</a></div>`:""}
 <p class="foot">${E(P.broker.name)} · צוות סרגייב · ${E(P.broker.phone)}</p>`;
 const drawFeed=()=>{const ids=["all"].concat(CHORD.filter(k=>cnt[k]||k==="lead"));if(!ids.includes(FLT))FLT="all";
  $("#cp").innerHTML=ids.map(k=>`<button type="button" aria-pressed="${FLT===k}" data-k="${k}" style="--c:${k==="all"?"#16191F":CH[k].c}">${k!=="all"?'<i class="dot"></i>':""}${k==="all"?"הכל":CH[k].n} <b>${k==="all"?ev.length:cnt[k]||0}</b></button>`).join("");
  $("#cp").querySelectorAll("button").forEach(b=>b.onclick=()=>{FLT=b.dataset.k;SHOWN=40;drawFeed()});
  const F=ev.filter(e=>FLT==="all"||e.ch===FLT);let last="",h="";
  F.slice(0,SHOWN).forEach(e=>{const d=heD(e.ts);if(d!==last){h+=`<li class="dh">${E(d)}</li>`;last=d}const c=CH[e.ch];
   h+=`<li class="it" style="--c:${c.c}"><span class="ic" aria-hidden="true">${c.i}</span><span><b>${E(e.title)}</b>${e.text?`<span class="s">${E(e.text)}</span>`:""}</span>${e.amt?`<span class="amt">${E(fm(e.amt))}</span>`:""}</li>`});
  $("#fd").innerHTML=h||(FLT==="lead"?'<li class="empty">עדיין לא התקבלו פניות של קונים על הנכס. כל פנייה תופיע כאן ברגע שתגיע.</li>':'<li class="empty">פעולות השיווק יופיעו כאן ברגע שיתבצעו.</li>');
  if(F.length>SHOWN){const b=document.createElement("button");b.className="btn gh more";b.type="button";b.textContent="להציג עוד "+(F.length-SHOWN);b.onclick=()=>{SHOWN+=40;drawFeed()};$("#fd").after(b)}else{const o=document.querySelector(".more");if(o)o.remove()}};
 drawFeed();
 document.querySelectorAll(".rq").forEach(c=>c.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const all=c.querySelectorAll("button");all.forEach(x=>x.disabled=true);
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"oans",k:K,row:+c.dataset.row,ans:b.dataset.a,text:c.querySelector("textarea").value.trim()})});const j=await r.json();if(!j.ok)throw 0;
   const q=P.reqs.find(x=>x.row===+c.dataset.row);if(q)q.st=b.dataset.a==="yes"?"approved":"declined";render();window.scrollTo(0,0)}catch(e){all.forEach(x=>x.disabled=false);alertBox("לא נשלח – נסו שוב")}}));
 $("#lo").onclick=logout;
 $("#snd").onclick=async()=>{const t=$("#tx").value.trim();if(!t)return;const b=$("#snd");b.disabled=true;b.textContent="שולח…";
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"omsg",k:K,text:t})});const j=await r.json();if(!j.ok)throw 0;
   P.msgs=(P.msgs||[]).concat([{d:new Date().toISOString().slice(0,16).replace("T"," "),from:"בעלים",text:t}]);render();$("#st").textContent="✓ ההודעה נשלחה, נחזור אליכם בהקדם."}
  catch(e){b.disabled=false;b.textContent="שליחה";$("#st").textContent="לא נשלח – נסו שוב."}}}
function alertBox(m){const s=$("#st");if(s)s.textContent=m}
load();
</script></body></html>
