<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body><title>לוח שיווק סרגייב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800;900&display=swap">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --fg:#17150f; --muted:#615b4c; --line:#e3ddcf;
  --gold:#a87b1e; --gold-soft:#f6ecd4; --wa:#138a4e; --off:#9b2c2c; --blue:#1d5fb8;
  --body:"Assistant","Arial Hebrew","Arial",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12110e; --surface:#1c1a16; --fg:#f1ecdf; --muted:#b3ab98; --line:#322e26;
  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --off:#f19c9c; --blue:#7fb0f0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12110e; --surface:#1c1a16; --fg:#f1ecdf; --muted:#b3ab98; --line:#322e26;
  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --off:#f19c9c; --blue:#7fb0f0; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;text-align:right;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:28px;margin:8px 0 2px}h1 b{color:var(--gold)}
.sub{color:var(--muted);margin:0 0 14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;background:var(--gold);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;justify-content:center}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa)}.btn.fb{background:#1877f2}.btn.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.btn.y2{background:#ff7100}.btn.md{background:#3a3fd6}.btn.off{background:transparent;color:var(--off);border:1.5px solid var(--off)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.add{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px;flex-wrap:wrap}
.add input{font:inherit;font-size:20px;flex:1;min-width:140px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.msg{color:var(--off);font-weight:700;width:100%;margin:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.head{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
.head img{width:86px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.head .t{flex:1;min-width:0}.head .t b{font-size:19px;display:block}.head .t span{color:var(--muted);font-size:15px}
.num{background:var(--gold-soft);color:var(--gold);font-weight:800;border-radius:8px;padding:2px 8px;font-size:14px}
.body{border-top:1.5px solid var(--line);padding:12px}
.sec{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tog{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-weight:600}
.tog label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--gold)}
textarea{font:inherit;width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:10px;min-height:120px;line-height:1.55}
.cnt{font-size:14px;color:var(--muted)}.cnt.bad{color:var(--off);font-weight:700}
.prev{display:flex;gap:10px;flex-wrap:wrap}
.prev canvas{width:calc(50% - 5px);height:auto;border-radius:10px;border:1px solid var(--line);background:#000}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumbs div{position:relative;aspect-ratio:4/3;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:3px solid transparent}
.thumbs div.on{border-color:var(--gold)}
.thumbs div i{position:absolute;top:4px;right:4px;background:var(--gold);color:#fff;font-style:normal;font-weight:800;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.opt button{font:inherit;font-weight:700;border-radius:10px;padding:6px 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.hint{color:var(--muted);font-size:14px;margin:4px 0}
.glist{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17150f;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
details.set{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:16px}
details.set summary{font-weight:700;cursor:pointer}
.set input{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);direction:ltr}
.bdg{font-size:13px;font-weight:800;border-radius:8px;padding:2px 8px;display:inline-block;margin-top:4px;margin-left:4px}
.bdg.due{background:#fde8d4;color:#a14a00}.bdg.okb{background:#e3f4ea;color:#17703f}.bdg.drop{background:#fde2e2;color:#b42318}
.st{font-size:13px;color:var(--muted);margin:2px 0 6px}.st.ok{color:#17803f}.st.old{color:#b45309;font-weight:700}
.gitem{display:flex;flex-direction:column;gap:2px}
.vsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.vsel span{font-size:14px;color:var(--muted)}
.vsel button{font:inherit;font-size:14px;font-weight:700;border-radius:8px;padding:3px 10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.vsel button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.buyer{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}.buyer b{display:block}.buyer small{color:var(--muted)}
.ohf{display:flex;gap:8px;flex-wrap:wrap}.ohf input{font:inherit;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
video.rv{width:100%;max-width:300px;border-radius:12px;background:#000;display:block;margin:8px 0}
.prev canvas.st9{width:calc(33% - 5px)}
#sdot{font-size:12px;color:var(--muted)}
.soon{background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:15px}
</style>

    <p class="hint">קישור העלאה למדלן</p><input id="lmd">
    <p class="hint">סנכרון בין מכשירים – קישור (מהגיליון)</p><input id="lsync" placeholder="https://script.google.com/macros/s/.../exec"><div class="row"><button class="btn sm" id="saveset" type="button">שמור הגדרות</button></div>
  </details>
  <div id="list"></div>

  el.innerHTML=`<div class="head"><img src="${esc(p.imgs[p.pick[0]]||"")}" alt=""><div class="t"><b>${esc(p.street+" "+p.hn)}</b><span>${esc(p.city)}${p.nb?" · "+esc(p.nb):""} · ${p.rooms||"?"} חד׳${p.price?" · "+fmt(p.price)+" ₪":""}</span><div class="bdgs">${badges(p)}</div></div><span class="num">#${p.id}</span></div><div class="body" hidden></div>`;
  const body=el.querySelector(".body");
  el.querySelector(".head").onclick=()=>{body.hidden=!body.hidden;if(!body.hidden&&!body._b){body._b=1;build(p.id,body)}};
  return el;
}

function openGroup(u){const m=u.match(/groups\/(\d+)/);
  if(!MOB||!m){window.open(u,"_blank");return}
  if(AND){location.href="intent://group/"+m[1]+"#Intent;scheme=fb;package=com.facebook.katana;S.browser_fallback_url="+encodeURIComponent(u)+";end";return}
  const t=setTimeout(()=>{if(!document.hidden)location.href=u},1500);document.addEventListener("visibilitychange",()=>{if(document.hidden)clearTimeout(t)},{once:true});location.href="fb://group?id="+m[1]}
function getGroups(){const t=LS.get("groups2",null);const src=t!=null?t:D.groups.map(g=>g[0]+" | "+g[1]).join("\n");return src.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(a=>a.length>1&&/^https?:/.test(a[1]))}
const UA=navigator.userAgent,IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),AND=/Android/.test(UA),MOB=IOS||AND;
function openApp(k,url){
  // k: "fb" page, "ig" account, "grp" group url
  const page=LS.get("lfb",D.links.fbpage||""), ig=LS.get("lig",D.links.ig||"");
  let web, ios, andr;
  if(k==="ig"){web=ig?"https://www.instagram.com/"+ig+"/":"https://www.instagram.com/";
    ios=ig?"instagram://user?username="+ig:"instagram://app";
    andr="intent://instagram.com/"+(ig?"_u/"+ig+"/":"")+"#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url="+encodeURIComponent(web)+";end";}
  else{web=k==="grp"?url:(page||"https://www.facebook.com/");
    ios=(k==="fb"&&!page)?"fb://feed":"fb://facewebmodal/f?href="+encodeURIComponent(web);
    andr="intent://facewebmodal/f?href="+encodeURIComponent(web)+"#Intent;scheme=fb;package=com.facebook.katana;S.browser_fallback_url="+encodeURIComponent(web)+";end";}
  if(!MOB){window.open(web,"_blank");return}
  if(AND){location.href=andr;return}
  const t=setTimeout(()=>{if(!document.hidden)location.href=web},1600);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)clearTimeout(t)},{once:true});
  location.href=ios;
}

  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function open(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));

  const box=document.createElement("form"); box.className="lock";
  box.innerHTML='<h1>לוח <b>שיווק</b></h1><p>הדף מוגן בסיסמה.</p><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit" class="btn wa">כניסה</button><p class="err" id="err" hidden>הסיסמה לא נכונה. נסו שוב.</p>';

  st.textContent='.lock{max-width:380px;margin:12vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:10px}.lock h1{font-size:28px}.lock label{font-weight:700}.lock input{font:inherit;font-size:20px;padding:10px 14px;min-height:52px;border-radius:12px;border:2px solid var(--gold);background:var(--surface);color:var(--fg);direction:ltr}.lock .err{color:var(--off);font-weight:700;margin:0}';

  async function tryPw(pw,remember){
    try{ const data=await open(pw); box.remove(); wrap.hidden=false;

      boot(data); return true; }catch(e){ return false; }
  }
  box.addEventListener("submit",async e=>{ e.preventDefault(); const pw=document.getElementById("pw").value;
    if(!(await tryPw(pw,true))){ document.getElementById("err").hidden=false; } });
  let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){ tryPw(saved,false).then(ok=>{ if(!ok){ try{ localStorage.removeItem(KEY); }catch(e){} } }); }
  else document.getElementById("pw").focus();
