  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function open(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  const box=document.createElement("form"); box.className="lock";
  box.innerHTML='<h1>לוח <b>שיווק</b></h1><p>הדף מוגן בסיסמה.</p><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit" class="btn wa">כניסה</button><p class="err" id="err" hidden>הסיסמה לא נכונה. נסו שוב.</p>';

  box.addEventListener("submit",async e=>{ e.preventDefault(); const pw=document.getElementById("pw").value;

  let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
