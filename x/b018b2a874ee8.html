<style>
/* Layout: sticky header with sync state + filters, then one column of buyer cards (who, what they want, when we last talked, one-tap actions). */
:root{

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --wa-ink:#ffffff;
  --ok:#7fd3a3; --ok-bg:#15291d; --warn:#f0bf6a; --warn-bg:#2d2312; --off:#f19c9c; --off-bg:#2e1717; --ink-on:#12110e; color-scheme:dark } }

  --ok:#7fd3a3; --ok-bg:#15291d; --warn:#f0bf6a; --warn-bg:#2d2312; --off:#f19c9c; --off-bg:#2e1717; --ink-on:#12110e; color-scheme:dark }

.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

<style>
#sgD{border:0;border-radius:16px;padding:0;width:min(640px,96vw);max-height:92vh;background:var(--surface);color:var(--fg);overflow:auto}
@media(max-width:700px){#sgD{width:100vw;max-width:100vw;height:100%;max-height:100%;margin:0;border-radius:0}}
#sgD .x{z-index:2;background:var(--surface)!important;border-radius:50%;width:40px;height:40px}@media(max-width:700px){#sgD .x{position:fixed!important;top:6px;left:6px}#sgD h3{padding-left:44px}}
#sgD .sug{display:flex;flex-direction:column;gap:4px}#sgD .sug button{font:inherit;font-size:15px;text-align:right;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px;cursor:pointer}
#sgD .ar{display:flex;gap:6px}#sgD .ar input{flex:1}
#sgD::backdrop{background:rgba(0,0,0,.5)}
#sgD .in{padding:16px;display:flex;flex-direction:column;gap:10px;direction:rtl}
#sgD h3{margin:0;font-size:20px}#sgD label{font-size:14px;font-weight:700;color:var(--muted);display:block}
#sgD input,#sgD textarea,#sgD select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:3px}
#sgD textarea{min-height:80px}
#sgD .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sgD .tb{display:flex;gap:6px}#sgD .tb button{flex:1}
#sgD .b{font:inherit;font-weight:800;font-size:16px;border-radius:12px;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;text-align:center}
#sgD .b.p{background:var(--gold);border-color:var(--gold);color:var(--ink-on)}#sgD .b.w{background:var(--wa);border-color:var(--wa);color:#fff}
#sgD .b[aria-pressed=true]{background:var(--fg);color:var(--bg)}
#sgD .pr{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:7px 10px;font-size:15px}
#sgD .pr button{border:0;background:none;color:var(--off);font-size:18px;cursor:pointer}
#sgD .ct{border-bottom:1px solid var(--line);padding:8px 0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#sgD .st{font-size:13px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--warn-bg);color:var(--warn)}#sgD .st.ok{background:var(--ok-bg);color:var(--ok)}
#sgD .hint{font-size:13px;color:var(--muted)}#sgD .x{position:absolute;left:10px;top:8px;border:0;background:none;font-size:24px;color:var(--muted);cursor:pointer}
.sgB{font:inherit}
</style>
<dialog id="sgD"><button class="x" type="button" onclick="this.closest('dialog').close()" aria-label="סגור">×</button><div class="in" id="sgI"></div></dialog>
<script>
(function(){
const SITE="https://sergyev-team.github.io/dirot/";
const E=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fm=n=>n?"₪"+Number(n).toLocaleString("en-US"):"";
const pad=n=>("0000"+n).slice(-5);
const sync=()=>(window.__KB&&window.__KB.DATA.sync)||null;
const wa=(ph,txt)=>"https://wa.me/972"+String(ph||"").replace(/\D/g,"").replace(/^972/,"").replace(/^0/,"")+"?text="+encodeURIComponent(txt);
const stN=p=>{let s=String(p&&p.addr||"").split(",")[0].replace(/\s*\d+[א-ת]?\s*$/,"").trim();if(!s)return"";return /^(רחוב|רח'|שד'|שדרות|סמטת|דרך|כיכר)/.test(s)?"ב"+s.replace(/^רח'\s*/,"רחוב "):"ברחוב "+s};
const msg=(name,link,pr)=>"שלום "+(name||"")+" 👋\nשמחים שקבענו פגישה"+(stN(pr&&pr[0])?" לראות את הדירה "+stN(pr[0]):"")+" 🏡\n\nכדי שנוכל להגיע ולהתמקד ישר בדירה, מצרף קישור לחתימה על הזמנת שירותי תיווך. נא לחתום לפני הפגישה 🙏\n👇\n"+link+"\n\nמחכים לראותך!\nמשה מאיר כהן – צוות סרגייב\n📞 054-9071916";
let F=null;
function open(b){F={name:(b&&b.name)||"",phone:(b&&b.phone)||"",props:[],fee:2,notes:""};drawNew();$D().showModal()}
const $D=()=>document.getElementById("sgD"),$I=()=>document.getElementById("sgI");
function tabs(on){return `<h3>✍️ החתמת לקוח</h3><div class="tb"><button type="button" class="b" data-v="new" aria-pressed="${on=="new"}">➕ טופס חדש</button><button type="button" class="b" data-v="list" aria-pressed="${on=="list"}">📄 טפסים שנשלחו</button></div>`}
function bindTabs(){$I().querySelectorAll(".tb .b").forEach(x=>x.onclick=()=>x.dataset.v=="new"?drawNew():drawList())}
function drawNew(){const A=(window.__KB&&window.__KB.APTS)||[];
 $I().innerHTML=tabs("new")+`
 <label>סוג טופס<select disabled><option>🔑 קונה – הזמנת שירותי תיווך לקניית נכס</option></select></label>
 <div class="g2"><label>שם הלקוח<input id="sgN" value="${E(F.name)}"></label><label>טלפון<input id="sgP" type="tel" value="${E(F.phone)}"></label></div>
 <label>הוספת נכס מהלוח (מספר נכס או רחוב)</label><div class="ar"><input id="sgA" placeholder="למשל 416 או סוקולוב" autocomplete="off"><button type="button" class="b" id="sgAadd">➕ הוסף</button></div>
 <div class="sug" id="sgS"></div>
 <details><summary class="hint">או הוספת נכס ידנית (שלא בלוח)</summary><div class="g2" style="margin-top:6px"><label>כתובת מלאה<input id="sgMa" placeholder="רחוב, מספר, עיר, קומה"></label><label>מחיר<input id="sgMp" inputmode="numeric"></label></div><div class="g2"><label>סוג<input id="sgMt" value="דירה"></label><button type="button" class="b" id="sgMadd" style="align-self:end">➕ הוסף</button></div></details>
 <div id="sgPr"></div>
 <div class="g2"><label>אחוז דמי תיווך (+ מע"מ)<input id="sgF" inputmode="decimal" value="${E(F.fee)}"></label><span></span></div>
 <label>הערות ותוספות להסכם (לא חובה)<textarea id="sgT">${E(F.notes)}</textarea></label>
 <p class="hint">הלקוח ימלא בעצמו ת״ז, כתובת ומייל, ויחתום. העתק חתום יישלח אליו ואליך במייל.</p>
 <button type="button" class="b p" id="sgGo">🔗 צור קישור לחתימה</button><div id="sgOut"></div>`;
 bindTabs();drawProps();
 const sa=document.getElementById("sgA"),sg=document.getElementById("sgS");
 const addA=a=>{addProp({addr:a.street+" "+a.hn+", "+a.city+(a.floor!==""&&a.floor!=null?", קומה "+a.floor:""),price:a.price||"",type:a.type||"דירה"});sa.value="";sg.innerHTML="";toastS("✓ נוסף נכס #"+a.id)};
 const find=q=>{q=q.trim().replace(/^#/,"");if(!q)return [];const n=q.replace(/\D/g,"");if(n&&n===q)return A.filter(x=>String(x.id)===n).concat(A.filter(x=>String(x.id).startsWith(n)&&String(x.id)!==n)).slice(0,6);return A.filter(x=>(x.street+" "+x.hn+" "+(x.nb||"")+" "+x.city).includes(q)).slice(0,6)};
 sa.oninput=()=>{const r=find(sa.value);sg.innerHTML=r.map(a=>`<button type="button" data-id="${a.id}">#${a.id} · ${E(a.street+" "+a.hn)}, ${E(a.city)}${a.floor!==""&&a.floor!=null?" · קומה "+a.floor:""}${a.price?" · "+fm(a.price):""}</button>`).join("")||(sa.value.trim()?'<p class="hint">לא נמצא נכס פעיל – אפשר להוסיף ידנית למטה</p>':"");
  sg.querySelectorAll("button").forEach(x=>x.onclick=()=>addA(A.find(a=>a.id==x.dataset.id)))};
 const addFirst=()=>{const r=find(sa.value);if(r.length)addA(r[0]);else toastS("לא נמצא נכס כזה")};
 document.getElementById("sgAadd").onclick=addFirst;sa.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addFirst()}};
 document.getElementById("sgMadd").onclick=()=>{const ad=document.getElementById("sgMa").value.trim();if(!ad){alertT("הקלד כתובת");return}addProp({addr:ad,price:+document.getElementById("sgMp").value.replace(/\D/g,"")||"",type:document.getElementById("sgMt").value.trim()||"דירה"});document.getElementById("sgMa").value="";document.getElementById("sgMp").value=""};
 document.getElementById("sgGo").onclick=create}
function addProp(p){F.props.push(p);drawProps()}
function toastS(m){const o=document.getElementById("sgPr");if(!o)return;const s=document.createElement("p");s.className="hint";s.textContent=m;o.prepend(s);setTimeout(()=>s.remove(),2000)}
function drawProps(){const h=document.getElementById("sgPr");h.innerHTML=F.props.length?F.props.map((p,i)=>`<div class="pr"><span>${E(p.addr)} · ${E(fm(p.price))} · ${E(p.type)}</span><button type="button" data-i="${i}" aria-label="הסר">✕</button></div>`).join(""):'<p class="hint">עדיין לא נוספו נכסים.</p>';
 h.querySelectorAll("button").forEach(x=>x.onclick=()=>{F.props.splice(+x.dataset.i,1);drawProps()})}
function alertT(t){const o=document.getElementById("sgOut");if(o)o.innerHTML=`<p class="st">${E(t)}</p>`}
async function create(){const s=sync();F.name=document.getElementById("sgN").value.trim();F.phone=document.getElementById("sgP").value.trim();F.fee=+String(document.getElementById("sgF").value).replace(/[^\d.]/g,"")||2;F.notes=document.getElementById("sgT").value.trim();
 if(!s){alertT("אין חיבור לגיליון – רענן את הלוח בעוד דקה");return}if(!F.name){alertT("חסר שם לקוח");return}if(F.phone.replace(/\D/g,"").length<9){alertT("חסר טלפון");return}if(!F.props.length){alertT("הוסף לפחות נכס אחד");return}
 const b=document.getElementById("sgGo");b.disabled=true;b.textContent="יוצר…";
 try{const r=await fetch(s.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({t:s.token,op:"cnew",c:{type:"buy",name:F.name,phone:F.phone,props:F.props,fee:F.fee,notes:F.notes,hideNum:!!(document.getElementById("sgH")||{}).checked}})});const j=await r.json();if(!j.ok)throw new Error(j.error||"שגיאה");
  const link=SITE+"s/?k="+j.k;
  document.getElementById("sgOut").innerHTML=`<p><b>✓ טופס מס' ${pad(j.n)} מוכן</b></p><a class="b w" target="_blank" rel="noopener" href="${wa(F.phone,msg(F.name,link,F.props))}">💬 שלח ללקוח בוואטסאפ</a> <button type="button" class="b" id="sgCp">📋 העתק קישור</button>`;
  document.getElementById("sgCp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(link);document.getElementById("sgCp").textContent="✓ הועתק"};b.textContent="✓ נוצר";}
 catch(e){alertT("שגיאה: "+e.message);b.disabled=false;b.textContent="🔗 צור קישור לחתימה"}}
async function drawList(){$I().innerHTML=tabs("list")+'<div id="sgLs"><p class="hint">טוען…</p></div>';bindTabs();const s=sync(),h=document.getElementById("sgLs");
 if(!s){h.innerHTML='<p class="hint">אין חיבור לגיליון.</p>';return}
 try{const r=await fetch(s.url+"?t="+encodeURIComponent(s.token)+"&op=clist");const j=await r.json();if(!j.ok)throw new Error(j.error||"שגיאה");
  h.innerHTML=j.items.length?j.items.map(c=>{const ok=!!c.signed,link=SITE+"s/?k="+c.k;return `<div class="ct"><span><b>${pad(c.n)}</b> · ${E(c.name)} · <span class="hint">${E(c.created)}</span></span><span class="st ${ok?"ok":""}">${ok?"✓ נחתם "+E(c.signed):"⏳ ממתין לחתימה"}</span>
   <span style="display:flex;gap:6px">${ok&&c.pdf?`<a class="b" target="_blank" rel="noopener" href="${E(c.pdf)}">📄 PDF</a>`:`<a class="b w" target="_blank" rel="noopener" href="${E(wa(c.phone,msg(c.name,link)))}">💬 שלח שוב</a>`}</span></div>`}).join(""):'<p class="hint">עוד לא נשלחו טפסים.</p>'}
 catch(e){h.innerHTML='<p class="hint">שגיאה: '+E(e.message)+'</p>'}}
window.SIGNBTN=function(b){const x=document.createElement("button");x.type="button";x.className="btn sgB";x.textContent="✍️ החתמה";x.onclick=()=>open(b);return x};
window.SIGNOPEN=open;
document.addEventListener("DOMContentLoaded",()=>{const t=document.getElementById("sgnT");if(t)t.onclick=()=>open(null)});
})();
</script>



<script>
function boot(DATA){
const SITE="https://sergyev-team.github.io/dirot/";
const K_CACHE="kb_cache_v1", K_PEND="kb_pending_v1";
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const today=()=>{const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const ddmm=()=>{const d=new Date(); return String(d.getDate()).padStart(2,"0")+String(d.getMonth()+1).padStart(2,"0");};
const dd=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
function toast(m){const t=$("toast"); t.textContent=m; t.className="show"; clearTimeout(t._h); t._h=setTimeout(()=>t.className="",2400);}
const APTS=DATA.apts; window.__KB={DATA:DATA,APTS:APTS,S:()=>S};
if(DATA.script) fetch(DATA.script+"?removed=1").then(r=>r.json()).then(j=>{ if(!j||!j.ok) return; const rm=j.removed||{}; let n=0;
  for(let i=APTS.length-1;i>=0;i--) if(rm[String(APTS[i].id)]){ APTS.splice(i,1); n++; } if(n) render(); }).catch(()=>{});
let S=store.get(K_CACHE,null) || {buyers:DATA.buyers, profiles:DATA.profiles, at:DATA.built};
let PEND=store.get(K_PEND,[]);
const st={view:"all", qmore:false, rate:"", status:"פעיל", q:"", sort:"fresh", rooms:new Set(), must:new Set(), bmin:0, bmax:0, hood:""};
let syncState=DATA.script?"…":"local";

// ---- matching
const prof=n=>S.profiles.find(p=>p.name==n);
function matches(p){ if(!p||!p.deal) return [];
  const hoods=(p.hoods||"").split(",").map(s=>s.trim()).filter(Boolean);
  return APTS.filter(a=>a.deal==p.deal && a.rooms && a.rooms>=p.rmin && a.rooms<=(p.rmax||99) && a.price>0 && (!p.budget||a.price<=p.budget)
    && (!hoods.length || hoods.some(h=>(a.nb||"").includes(h)))
    && ["el","pk","mm"].every(k=>!(p[k]=="חובה"&&a[k]=="לא") && !(p[k]=="חובה (צוין)"&&a[k]!="כן"))); }
function lastOf(b){ if(b.last) return b.last; const mo=String(b.month||"").replace(/^'/,""); const m=/^(\d{1,2})\/(\d{4})$/.exec(mo); if(m){ return m[2]+"-"+m[1].padStart(2,"0")+"-01"; } if(/^\d{4}-\d{2}-\d{2}/.test(mo)) return mo.slice(0,8)+"01"; return ""; }
function days(s){ if(!s) return null; return Math.floor((new Date(today()+"T00:00:00")-new Date(s+"T00:00:00"))/864e5); }
function crit(p){ if(!p||!p.deal) return ""; const rm=p.rmin==p.rmax||!p.rmax?p.rmin+" חד׳":p.rmax>=99?p.rmin+"+ חד׳":p.rmin+"–"+p.rmax+" חד׳";
  const must=[["el","מעלית"],["pk","חניה"],["mm","ממ״ד"]].filter(([k])=>String(p[k]||"").startsWith("חובה")).map(x=>x[1]);
  return [rm, must.join(", "), p.budget?(p.deal=="השכרה"?"עד "+p.budget.toLocaleString("he-IL")+" ₪ לחודש":"עד "+(p.budget/1e6).toFixed(2).replace(/\.?0+$/,"")+" מיליון"):""].filter(Boolean).join(", "); }
function info(b){ const p=prof(b.profile); const m=matches(p); const l=lastOf(b); const nw=l?m.filter(a=>a.first>l).length:0; return {p,m,l,nw,d:days(l)}; }
const RANK={"A++":3,"A+":2,"A":1};
// ---- daily queue: each buyer comes back by rating; outcome buttons set the next date
const INTV={"A++":3,"A+":7,"A":14,"":30};
const addD=(s,n)=>{ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function dueOf(b){ if(b.next) return b.next; const l=lastOf(b); return l?addD(l,INTV[b.rating||""]||30):today(); }
// only buyers from the last ~1.5 months (by "חודש שיחה"; month counted until its last day)
const RECENT_DAYS=45;
function recent(b){ const m=/^(\d{1,2})\/(\d{4})$/.exec((b.month||"").trim()); if(!m) return false;
  const end=new Date(+m[2],+m[1],0,12); return end.toISOString().slice(0,10)>=addD(today(),-RECENT_DAYS); }
function inQueue(b){ return (b.status||"פעיל")=="פעיל" && recent(b) && (dueOf(b)<=today() || info(b).nw>0); }
const QCMP=(a,b)=>(info(b).nw>0)-(info(a).nw>0) || (RANK[b.rating]||0)-(RANK[a.rating]||0) || (dueOf(a)<dueOf(b)?-1:dueOf(a)>dueOf(b)?1:0);
function outcome(b,kind,days){ const d=new Date(), pad=x=>String(x).padStart(2,"0"); const stamp=pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  const iv=INTV[b.rating||""]||30; const f={};
  if(kind=="ans"){ f.last=today(); f.next=addD(today(),iv); }
  else if(kind=="sent"){ f.last=today(); f.next=addD(today(),iv); }
  else if(kind=="noans"){ f.next=addD(today(),1); }
  else if(kind=="irr"){ f.next=addD(today(),60); }
  else if(kind=="later"){ f.next=addD(today(),days); }
  const T={ans:"ענה",sent:"שלחתי דירות",noans:"לא ענה",irr:"לא רלוונטי כרגע",later:"לחזור אליו ב-"+dd(f.next)}[kind];
  f.notes=[stamp+" – "+T].concat((b.notes||"").split("\n").filter(s=>s.trim())).join("\n");
  change(b,f); toast(b.name+": "+T+" · יחזור לתור ב-"+dd(f.next)); }
const DRAFTS={}, OPEN_NOTES=new Set(), EDIT_OPEN=new Set();
const isPersonal=n=>/^אישי · /.test(n||"");
const RMS=[2,2.5,3,3.5,4,4.5,5,5.5,6];
function searchLink(p){ const must=["el","pk","mm"].filter(k=>String(p[k]||"").startsWith("חובה")).join("");
  return SITE+"#s="+encodeURIComponent([p.deal=="השכרה"?"r":"m",p.rmin+"-"+(p.rmax||p.rmin),p.budget||0,must,(p.hoods||"").split(",").map(s=>s.trim()).filter(Boolean).join("|")].join("~")); }
function topHoods(){ const c={}; APTS.forEach(a=>{ if(a.nb) c[a.nb]=(c[a.nb]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]); }
function editor(b,li){ const p0=prof(b.profile)||{}; const v={deal:p0.deal||"מכירה",rmin:p0.rmin||0,rmax:p0.rmax||p0.rmin||0,budget:p0.budget||0,el:p0.el||"",pk:p0.pk||"",mm:p0.mm||"",hoods:(p0.hoods||"").split(",").map(s=>s.trim()).filter(Boolean),note:p0.note||""};
  const box=el("div","ed"); const draw=()=>{ box.innerHTML="";
    box.append(el("h3",null,"מה "+b.name+" מחפש?"));
    const fr=el("div","from"); fr.append("להתחיל מ:"); const fs=el("select"); fs.append(new Option("— הגדרה חדשה —",""));
    S.profiles.filter(x=>!isPersonal(x.name)&&x.deal).forEach(x=>fs.append(new Option(x.name+" ("+crit(x)+")",x.name)));
    fs.onchange=()=>{ const x=prof(fs.value); if(x){ Object.assign(v,{deal:x.deal,rmin:x.rmin,rmax:x.rmax||x.rmin,budget:x.budget,el:x.el,pk:x.pk,mm:x.mm,hoods:(x.hoods||"").split(",").map(s=>s.trim()).filter(Boolean),note:x.note||""}); draw(); } };
    fr.append(fs); box.append(fr);
    const seg=(lab,opts,get,set)=>{ const w=el("div"); w.append(el("div","lb",lab)); const c=el("div","chips"); opts.forEach(([t,val])=>{ const x=el("button","chip",t); x.type="button"; x.setAttribute("aria-pressed",get()==val); x.onclick=()=>{ set(val); draw(); }; c.append(x); }); w.append(c); return w; };
