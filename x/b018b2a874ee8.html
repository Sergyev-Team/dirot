<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>לוח קונים סרגייב</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky header with sync state + filters, then one column of buyer cards (who, what they want, when we last talked, one-tap actions). */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --fg:#17150f; --muted:#615b4c; --line:#e3ddcf;
  --gold:#a87b1e; --gold-soft:#f6ecd4; --wa:#138a4e; --wa-ink:#ffffff;
  --ok:#1f7a48; --ok-bg:#e5f3ea; --warn:#9a5b00; --warn-bg:#fbefd9; --off:#9b2c2c; --off-bg:#f8e3e3; --ink-on:#ffffff;
  --body:"Assistant","Arial Hebrew","Arial",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12110e; --surface:#1c1a16; --fg:#f1ecdf; --muted:#b3ab98; --line:#322e26;
  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --wa-ink:#ffffff;
  --ok:#7fd3a3; --ok-bg:#15291d; --warn:#f0bf6a; --warn-bg:#2d2312; --off:#f19c9c; --off-bg:#2e1717; --ink-on:#12110e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12110e; --surface:#1c1a16; --fg:#f1ecdf; --muted:#b3ab98; --line:#322e26;
  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --wa-ink:#ffffff;
  --ok:#7fd3a3; --ok-bg:#15291d; --warn:#f0bf6a; --warn-bg:#2d2312; --off:#f19c9c; --off-bg:#2e1717; --ink-on:#12110e; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;text-align:right}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;margin:0}
h1 b{color:var(--gold)}
.sync{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--warn-bg);color:var(--warn)}
.sync.ok{background:var(--ok-bg);color:var(--ok)} .sync.err{background:var(--off-bg);color:var(--off)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
#q{flex:1 1 180px;min-width:0;font:inherit;font-size:18px;font-weight:700;color:var(--fg);background:var(--surface);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;min-height:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;font-weight:800;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rmn{margin-inline-start:6px;padding-inline-start:6px;border-inline-start:1.5px solid currentColor}
.rml{font-size:15px;font-weight:800;color:var(--muted);align-self:center}
.chip .n{font-variant-numeric:tabular-nums;color:var(--gold);margin-inline-start:4px}
.chip[aria-pressed="true"] .n{color:var(--gold-soft)}
select{font:inherit;font-size:15px;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-height:38px}
.add{font:inherit;font-weight:800;background:var(--gold);color:var(--ink-on);border:0;border-radius:12px;padding:0 14px;min-height:48px;cursor:pointer}
.sect{font-size:14px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.card.closed{opacity:.7}
.card.done{border:2px solid #1f8a4c;box-shadow:inset 6px 0 0 #1f8a4c}
.donebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#e3f4ea;color:#11592f;border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px}
.donebar button{font:inherit;font-size:14px;font-weight:800;border:0;background:#1f8a4c;color:#fff;border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer}
.chip.dn[aria-pressed="true"]{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
@media (prefers-color-scheme:dark){.donebar{background:#123824;color:#8fe0b0}.card.done{border-color:#3fbf78;box-shadow:inset 6px 0 0 #3fbf78}}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-size:20px;font-weight:800;margin:0}
.rate{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-inline-start:auto}
.rate button{font:inherit;font-size:15px;font-weight:800;border:0;background:transparent;color:var(--muted);padding:5px 10px;min-width:46px;min-height:36px;cursor:pointer;direction:ltr}
.rate button+button{border-inline-start:1.5px solid var(--line)}
.rate button[aria-pressed="true"]{background:var(--gold);color:var(--ink-on)}
.tel{font-weight:700;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.want{margin:0;color:var(--muted)}
.wantrow{display:flex;align-items:flex-start;gap:8px}.wantrow .want{flex:1}
.edbtn{font:inherit;font-size:14px;font-weight:800;border:1.5px solid var(--gold);color:var(--gold);background:var(--surface);border-radius:999px;padding:4px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.edbtn.need{background:var(--gold);color:var(--ink-on)}
.ed{border:2px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ed h3{margin:0;font-size:17px}
.ed .lb{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:4px}
.ed .chips .chip{min-height:36px;padding:4px 11px}
.ed input{font:inherit;font-size:17px;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;min-height:42px;width:100%;box-sizing:border-box}
.ed .bud{display:flex;align-items:center;gap:8px}.ed .bud input{width:120px;direction:ltr;text-align:center}
.ed .from{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:14px;font-weight:800;color:var(--muted)}.ed .from select{width:100%;min-width:0;max-width:100%}
.ed,.ed>*{min-width:0;max-width:100%}
.ed .sum{font-size:15px;font-weight:800;background:var(--gold-soft);border-radius:8px;padding:6px 10px}
.want b{color:var(--fg)}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:14px;font-weight:800;border-radius:8px;padding:2px 9px;background:var(--gold-soft);color:var(--fg)}
.pill.new{background:var(--gold);color:var(--ink-on)}
.pill.late{background:var(--off-bg);color:var(--off)} .pill.mid{background:var(--warn-bg);color:var(--warn)} .pill.fresh{background:var(--ok-bg);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);flex:1 1 130px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.rate button:focus-visible,.add:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.notes{display:flex;flex-direction:column;gap:6px}
.nlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nlog li{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:15px;display:flex;flex-direction:column}
.nlog time{font-size:12px;font-weight:800;color:var(--gold);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.nmore{font:inherit;font-size:14px;font-weight:700;background:none;border:0;color:var(--gold);cursor:pointer;padding:2px 0;text-align:right}
.nsave{flex:0 0 auto;align-self:flex-start;min-width:140px}
textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:64px;resize:vertical;width:100%}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.panel label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.panel input,.panel select{font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
/* apartment → buyers */
.mode{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.mode button{font:inherit;font-size:16px;font-weight:800;border:0;background:transparent;color:var(--muted);padding:8px 14px;min-height:44px;cursor:pointer;flex:1}
.mode button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.top.apt .buyersOnly{display:none}
.sugg{display:flex;flex-direction:column;gap:6px;list-style:none;margin:8px 0 0;padding:0}
.sugg button{font:inherit;font-size:16px;text-align:right;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
.sugg b{color:var(--gold)}
.apt{background:var(--surface);border:2px solid var(--gold);border-radius:14px;overflow:hidden;display:flex;gap:12px;margin-top:12px}
.apt img{width:120px;object-fit:cover;flex:none;background:var(--gold-soft)}
.apt .in{padding:12px 12px 12px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.apt .no{font-size:14px;font-weight:800;color:var(--gold)}
.apt .ad{font-size:19px;font-weight:800;margin:0}
.apt .sp{color:var(--muted);margin:0}
.apt .pr{font-size:20px;font-weight:800;margin:0}
.apt .pr s{font-size:15px;color:var(--muted);font-weight:600;margin-inline-start:6px}
.apt a{color:var(--gold);font-weight:800}
.grp{font-size:17px;font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grp .cnt{background:var(--gold);color:var(--ink-on);border-radius:999px;padding:0 9px;font-size:15px}
.grp.near .cnt{background:var(--warn-bg);color:var(--warn)}
.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.m.sent{opacity:.6}
.m .who{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.m .who strong{font-size:18px}
.m .who span{font-size:14px;color:var(--muted)}
.m .why{flex-basis:100%;font-size:14px;font-weight:700;color:var(--warn);margin:0}
.m .r{font-size:13px;font-weight:800;border-radius:8px;padding:1px 7px;background:var(--gold-soft);direction:ltr}
.m .btn{flex:0 0 auto;min-width:120px}
.queue{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:14px}
.queue .row .btn{background:var(--bg);color:var(--fg)}
.queue .row .btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.opt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--muted)}
.opt input{width:20px;height:20px;accent-color:var(--gold)}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;max-width:520px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.outs{border:2px solid var(--gold);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.olab{font-weight:800;font-size:15px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob{font:inherit;font-size:15px;font-weight:800;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;min-height:46px;cursor:pointer}
.ogrid .ob:last-child{grid-column:1/-1}
.lat{display:flex;gap:6px;flex-wrap:wrap}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><h1>לוח <b>קונים</b></h1><span class="sync" id="sync">שמור בטלפון</span></div>
    <div class="mode" role="group" aria-label="מצב"><button type="button" id="mB" aria-pressed="true">קונים</button><button type="button" id="mA" aria-pressed="false">דירה ← קונים מתאימים</button></div>
    <div class="bar">
      <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="חיפוש לפי שם, טלפון או פרופיל" aria-label="חיפוש קונה">
      <button type="button" class="add buyersOnly" id="addBtn">+ קונה חדש</button>
    </div>
    <div class="chips buyersOnly" id="views" role="group" aria-label="תצוגה"></div>
    <div class="chips buyersOnly" id="rmf" role="group" aria-label="סינון לפי חדרים"></div>
    <div class="chips buyersOnly" role="group" aria-label="סינון">
      <span class="chips" id="rates"></span>
      <select id="sort" aria-label="מיון"><option value="new">קשר אחרון: מהחדש לישן</option><option value="old">קשר אחרון: מהישן לחדש</option><option value="rate">לפי דירוג</option></select>
      <select id="status" aria-label="סטטוס"><option value="פעיל">פעילים</option><option value="בהקפאה">בהקפאה</option><option value="קנה">קנו</option><option value="">כולם</option></select>
    </div>
  </div>
  <div id="banner"></div>
  <form class="panel" id="addForm" hidden>
    <strong>קונה חדש</strong>
    <label for="nName">שם<input id="nName" required autocomplete="off"></label>
    <label for="nPhone">טלפון<input id="nPhone" required inputmode="tel" autocomplete="off" placeholder="05X-XXXXXXX"></label>
    <label for="nProfile">מחפש כמו (פרופיל)<select id="nProfile"></select></label>
    <label for="nRate">דירוג<select id="nRate"><option value="">ללא</option><option>A</option><option>A+</option><option>A++</option></select></label>
    <div class="row"><button class="btn wa" type="submit">שמירה</button><button class="btn" type="button" id="addCancel">ביטול</button></div>
  </form>
  <div class="sect" id="sect"></div>
  <ul class="list" id="list" aria-live="polite"></ul>
</div>
<div id="toast" role="status"></div>

<script>
function boot(DATA){
const SITE="https://sergyev-team.github.io/dirot/";
const K_CACHE="kb_cache_v1", K_PEND="kb_pending_v1";
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const today=()=>{const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const ddmm=()=>{const d=new Date(); return String(d.getDate()).padStart(2,"0")+String(d.getMonth()+1).padStart(2,"0");};
const dd=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
function toast(m){const t=$("toast"); t.textContent=m; t.className="show"; clearTimeout(t._h); t._h=setTimeout(()=>t.className="",2400);}
const APTS=DATA.apts;
if(DATA.script) fetch(DATA.script+"?removed=1").then(r=>r.json()).then(j=>{ if(!j||!j.ok) return; const rm=j.removed||{}; let n=0;
  for(let i=APTS.length-1;i>=0;i--) if(rm[String(APTS[i].id)]){ APTS.splice(i,1); n++; } if(n) render(); }).catch(()=>{});
let S=store.get(K_CACHE,null) || {buyers:DATA.buyers, profiles:DATA.profiles, at:DATA.built};
let PEND=store.get(K_PEND,[]);
const st={view:"today", qmore:false, rate:"", status:"פעיל", q:"", sort:"new", rooms:new Set()};
let syncState=DATA.script?"…":"local";

// ---- matching
const prof=n=>S.profiles.find(p=>p.name==n);
function matches(p){ if(!p||!p.deal) return [];
  const hoods=(p.hoods||"").split(",").map(s=>s.trim()).filter(Boolean);
  return APTS.filter(a=>a.deal==p.deal && a.rooms && a.rooms>=p.rmin && a.rooms<=(p.rmax||99) && a.price>0 && (!p.budget||a.price<=p.budget)
    && (!hoods.length || hoods.some(h=>(a.nb||"").includes(h)))
    && ["el","pk","mm"].every(k=>!(p[k]=="חובה"&&a[k]=="לא") && !(p[k]=="חובה (צוין)"&&a[k]!="כן"))); }
function lastOf(b){ if(b.last) return b.last; const m=/^(\d{2})\/(\d{4})$/.exec(b.month||""); if(m){ return m[2]+"-"+m[1]+"-01"; } return ""; }
function days(s){ if(!s) return null; return Math.floor((new Date(today()+"T00:00:00")-new Date(s+"T00:00:00"))/864e5); }
function crit(p){ if(!p||!p.deal) return ""; const rm=p.rmin==p.rmax||!p.rmax?p.rmin+" חד׳":p.rmax>=99?p.rmin+"+ חד׳":p.rmin+"–"+p.rmax+" חד׳";
  const must=[["el","מעלית"],["pk","חניה"],["mm","ממ״ד"]].filter(([k])=>String(p[k]||"").startsWith("חובה")).map(x=>x[1]);
  return [rm, must.join(", "), p.budget?(p.deal=="השכרה"?"עד "+p.budget.toLocaleString("he-IL")+" ₪ לחודש":"עד "+(p.budget/1e6).toFixed(2).replace(/\.?0+$/,"")+" מיליון"):""].filter(Boolean).join(", "); }
function info(b){ const p=prof(b.profile); const m=matches(p); const l=lastOf(b); const nw=l?m.filter(a=>a.first>l).length:0; return {p,m,l,nw,d:days(l)}; }
const RANK={"A++":3,"A+":2,"A":1};
// ---- daily queue: each buyer comes back by rating; outcome buttons set the next date
const INTV={"A++":3,"A+":7,"A":14,"":30};
const addD=(s,n)=>{ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function dueOf(b){ if(b.next) return b.next; const l=lastOf(b); return l?addD(l,INTV[b.rating||""]||30):today(); }
// only buyers from the last ~1.5 months (by "חודש שיחה"; month counted until its last day)
const RECENT_DAYS=45;
function recent(b){ const m=/^(\d{1,2})\/(\d{4})$/.exec((b.month||"").trim()); if(!m) return false;
  const end=new Date(+m[2],+m[1],0,12); return end.toISOString().slice(0,10)>=addD(today(),-RECENT_DAYS); }
function inQueue(b){ return (b.status||"פעיל")=="פעיל" && recent(b) && (dueOf(b)<=today() || info(b).nw>0); }
const QCMP=(a,b)=>(info(b).nw>0)-(info(a).nw>0) || (RANK[b.rating]||0)-(RANK[a.rating]||0) || (dueOf(a)<dueOf(b)?-1:dueOf(a)>dueOf(b)?1:0);
function outcome(b,kind,days){ const d=new Date(), pad=x=>String(x).padStart(2,"0"); const stamp=pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  const iv=INTV[b.rating||""]||30; const f={};
  if(kind=="ans"){ f.last=today(); f.next=addD(today(),iv); }
  else if(kind=="sent"){ f.last=today(); f.next=addD(today(),iv); }
  else if(kind=="noans"){ f.next=addD(today(),1); }
  else if(kind=="irr"){ f.next=addD(today(),60); }
