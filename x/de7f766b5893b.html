<style>

.upbtn{position:relative}

label.l{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700;color:var(--muted)}
.ar{display:flex;gap:6px}.ar input{flex:1}
.sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}.sug button{font:inherit;font-size:15px;text-align:right;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px;cursor:pointer}
.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:7px 10px;font-size:15px;margin-top:6px}.pr button{border:0;background:none;color:var(--off);font-size:18px;cursor:pointer}
.ex{background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin:10px 0}.ex label.chk{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--fg)}.ex label.chk input{width:22px;height:22px}

a.btn{text-decoration:none}.btn.wa{background:var(--wa)}

input[type=date]::-webkit-date-and-time-value{text-align:right}
.ex{overflow:hidden}.ex label.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;line-height:1.35;margin-bottom:6px}

.nb{display:inline-block;background:#c0392b;color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:1px 8px;margin-inline-start:6px}

.mm{padding:7px 10px;border-radius:12px;margin:5px 0;font-size:14px;white-space:pre-wrap}.mm.o{background:var(--gold-soft)}.mm.f{background:var(--bg);border:1px solid var(--line)}.mm small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:99px;padding:6px 10px;cursor:pointer}.chips button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:800}
</style></head><body>
<div class="wrap">
 <h1>לוח <b>החתמות</b></h1><p class="sub">שליחת טפסי תיווך לחתימה דיגיטלית בוואטסאפ</p>
 <div class="tabs" id="modes"><button data-m="new">➕ טופס חדש</button><button data-m="list">📄 טפסים שנשלחו</button><button data-m="own" id="ownT">🏠 פורטל בעלים</button></div>
 <section class="mode" id="m-new"><div class="card" id="nw"></div></section>
 <div class="card" id="mngHd" hidden><b style="font-size:19px"></b><p class="hint" style="margin:4px 0 0">כל שינוי כאן מתעדכן בפורטל של בעל הנכס. אפשר לסגור את הלשונית בסיום.</p></div><section class="mode" id="m-own"><p class="hint upd" id="oUp" hidden>🔄 מעדכן נתונים…</p><div class="card own-top"><div class="row"><button class="btn" id="oNewT" style="flex:1">➕ פורטל חדש לבעל נכס</button><button class="btn ghost sm" id="oR">🔄</button></div><div id="oNew" hidden></div></div><div id="oLs"><p class="hint">טוען…</p></div></section>
 <section class="mode" id="m-list"><p class="hint upd" id="lUp" hidden>🔄 מעדכן נתונים…</p><div class="card"><div class="row"><input id="lq" placeholder="חיפוש לפי שם או טלפון" style="flex:1"><button class="btn ghost sm" id="lr">🔄 רענון</button></div><div id="ls"></div></div></section>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== לוח החתמות – משרד סרגייב ===== */
let U=null;
const SITE="https://sergyev-team.github.io/dirot/";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fm=n=>n?"₪"+Number(n).toLocaleString("en-US"):"";
const pad=n=>("0000"+n).slice(-5);
function toast(t,ms){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms||2200)}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addM=(s,m)=>{const d=new Date(s+"T12:00:00");const day=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()<day)d.setDate(0);return iso(d)};
const WHO={sell:["🏷️ בעל נכס – מכירה","הסכמה + בלעדיות"],let:["🔑 בעל נכס – השכרה","הסכמה + בלעדיות"],buy:["🛒 קונה","הזמנת שירותי תיווך לקנייה"],rentin:["🏠 שוכר","הזמנת שירותי תיווך לשכירות"]};
const TL={sell:"מוכר",let:"משכיר",buy:"קונה",rentin:"שוכר"};
const wa=(ph,txt)=>"https://wa.me/972"+String(ph||"").replace(/\D/g,"").replace(/^972/,"").replace(/^0/,"")+"?text="+encodeURIComponent(txt);
const stN=p=>{let s=String(p&&p.addr||"").split(",")[0].replace(/\s*\d+[א-ת]?\s*$/,"").trim();if(!s)return"";return /^(רחוב|רח'|שד'|שדרות|סמטת|דרך|כיכר)/.test(s)?"ב"+s.replace(/^רח'\s*/,"רחוב "):"ברחוב "+s};
const msg=(name,link,two,pr,tp)=>(tp==="sell"||tp==="let")?"שלום "+(name||"")+" 👋\nשמחים על האמון שלכם ועל ההחלטה "+(tp==="let"?"להשכיר":"לשווק")+" את הדירה"+(stN(pr&&pr[0])?" "+stN(pr[0]):"")+" דרכנו 🏡\n\nמצרף קישור לחתימה על הסכם שיווק"+(two?" ובלעדיות":"")+". החתימה דיגיטלית ולוקחת דקה 🙏\n👇\n"+link+"\n\n"+(two?"מיד אחרי החתימה יגיע אליכם מייל עם כניסה לפורטל אישי של הנכס – שם תוכלו לראות בכל רגע את הפרסומים, הפניות, הקונים המתאימים והפגישות.\n\n":"")+"יוצאים לדרך! 💪\nמשה מאיר כהן – צוות סרגייב\n📞 054-9071916":"שלום "+(name||"")+" 👋\nשמחים שקבענו פגישה"+(stN(pr&&pr[0])?" לראות את הדירה "+stN(pr[0]):"")+" 🏡\n\nכדי שנוכל להגיע ולהתמקד ישר בדירה, מצרף קישור לחתימה על הזמנת שירותי תיווך. נא לחתום לפני הפגישה 🙏\n👇\n"+link+"\n\nמחכים לראותך!\nמשה מאיר כהן – צוות סרגייב\n📞 054-9071916";
let F=null;
function reset(t){const today=iso(new Date());F={type:t||F&&F.type||"sell",name:"",phone:"",props:[],fee:2,months:1,excl:true,from:today,mon:6,to:addM(today,6),notes:""}}
const owner=()=>F.type==="sell"||F.type==="let",rent=()=>F.type==="let"||F.type==="rentin";
function keep(){const g=id=>{const x=document.getElementById(id);return x?x.value:null};
 if(g("nN")!=null){F.name=g("nN").trim();F.phone=g("nP").trim();F.notes=g("nT");if(rent())F.months=+g("nF")||1;else F.fee=+String(g("nF")).replace(/[^\d.]/g,"")||2;
  if(owner()){const x=$("#nX");F.excl=x.checked;if(F.excl){F.from=g("nFr")||F.from;F.to=g("nTo")||F.to}}}}
function drawNew(){const own=owner(),A=(U.apts||[]).filter(x=>!x.deal||(rent()?x.deal==="השכרה":x.deal!=="השכרה"));
 $("#nw").innerHTML=`<p class="lbl" style="margin-top:0">מי חותם?</p><div class="who">${Object.entries(WHO).map(([k,v])=>`<button type="button" data-t="${k}" class="${F.type===k?"on":""}">${v[0]}<small>${v[1]}</small></button>`).join("")}</div>
 <div class="g2 st"><label class="l">שם הלקוח (חיפוש בקונים שלך או לקוח חדש)<input id="nN" value="${E(F.name)}" autocomplete="off" placeholder="מתחילים להקליד שם…"></label><label class="l">טלפון (לוואטסאפ)<input id="nP" type="tel" value="${E(F.phone)}" autocomplete="off"></label></div><div class="sug" id="nNs"></div>
 <p class="lbl">${own?"הנכס":"הנכסים שהוצגו ללקוח"}</p>
 <div class="ar"><input id="nA" placeholder="מספר נכס או רחוב, למשל 416 או סוקולוב" autocomplete="off"><button type="button" class="btn ghost" id="nAadd">➕ הוסף</button></div><div class="sug" id="nS"></div>
 <details style="margin-top:8px"><summary class="hint">או הוספה ידנית (נכס שלא בלוח)</summary><div class="g2 st"><label class="l">כתובת מלאה<input id="nMa" placeholder="רחוב, מספר, עיר, קומה"></label><label class="l">${rent()?"שכר דירה חודשי":"מחיר"}<input id="nMp" inputmode="numeric"></label></div><div class="g2"><label class="l">סוג<input id="nMt" value="דירה"></label><button type="button" class="btn ghost" id="nMadd" style="align-self:end">➕ הוסף</button></div></details>
 <div id="nPr"></div>
 ${own?`<div class="ex"><label class="chk"><input type="checkbox" id="nX" ${F.excl?"checked":""}> כולל הסכם בלעדיות (באותו קישור)</label>
  <div id="nXw" ${F.excl?"":"hidden"}><div class="g2"><label class="l">מתאריך<input type="date" id="nFr" value="${F.from}"></label><label class="l">תקופה<select id="nMo">${[1,2,3,4,5,6,9,12].map(m=>`<option value="${m}" ${F.mon===m?"selected":""}>${m} חודשים</option>`).join("")}<option value="0" ${F.mon===0?"selected":""}>תאריך אחר…</option></select></label></div>
  <label class="l">עד תאריך<input type="date" id="nTo" value="${F.to}"></label></div></div>`:""}
 <div class="g2"><label class="l">${rent()?"דמי תיווך – מספר חודשי שכירות (+ מע״מ)":"אחוז דמי תיווך (+ מע״מ)"}<input id="nF" inputmode="decimal" value="${rent()?F.months:F.fee}"></label><span></span></div>
 <label class="l">הערות ותוספות להסכם (לא חובה – יופיעו בטופס)<textarea id="nT" style="min-height:90px">${E(F.notes)}</textarea></label>
 <p class="hint">הלקוח ימלא בעצמו ת״ז, כתובת ומייל ויחתום. העתק חתום יישלח אליו ואליך במייל, וה-PDF נשמר ב-Drive.</p>
 <button type="button" class="btn big" id="nGo">🔗 צור קישור לחתימה</button><div id="nOut"></div>`;
 $$(".who button").forEach(b=>b.onclick=()=>{keep();const was=owner();F.type=b.dataset.t;if(owner()!==was)F.props=[];if(rent()&&!F.months)F.months=1;drawNew()});
 drawProps();
 const nn=$("#nN"),np=$("#nP"),ns=$("#nNs");
 const bfind=()=>{const q=nn.value.trim(),d=np.value.replace(/\D/g,"");const seen=new Set();
  return BUY.filter(b=>{const ph=String(b.phone||"").replace(/\D/g,"");const ok=(q.length>=2&&String(b.name).includes(q))||(d.length>=3&&ph.includes(d));if(!ok||seen.has(ph+b.name))return false;seen.add(ph+b.name);return true}).slice(0,6)};
 const bsug=()=>{const r=bfind(),q=nn.value.trim();if(!r.length){ns.innerHTML="";return}
  ns.innerHTML=r.map((b,i)=>`<button type="button" data-i="${i}">👤 ${E(b.name)}${b.phone?" · "+E(b.phone):""}${b.profile?` <small class="hint">· ${E(b.profile)}</small>`:""}</button>`).join("")+`<button type="button" data-new="1">➕ לקוח חדש${q?": "+E(q):""}</button>`;
  ns.querySelectorAll("button").forEach(x=>x.onclick=()=>{if(!x.dataset.new){const b=r[+x.dataset.i];nn.value=b.name;np.value=b.phone||"";toast("✓ נבחר "+b.name)}ns.innerHTML="";F.name=nn.value.trim();F.phone=np.value.trim()})};
 nn.oninput=bsug;np.oninput=bsug;

  async function open(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));

  const box=document.createElement("form"); box.className="lock";
  box.innerHTML='<h1>לוח <b>החתמות</b></h1><p>הדף מוגן בסיסמה.</p><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit" class="btn wa">כניסה</button><p class="err" id="err" hidden>הסיסמה לא נכונה. נסו שוב.</p>';

  st.textContent='.lock{max-width:380px;margin:12vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:10px}.lock h1{font-size:28px}.lock label{font-weight:700}.lock input{font:inherit;font-size:20px;padding:10px 14px;min-height:52px;border-radius:12px;border:2px solid var(--gold);background:var(--surface);color:var(--fg);direction:ltr}.lock .err{color:var(--off);font-weight:700;margin:0}';

  async function tryPw(pw,remember){

      boot(data); return true; }catch(e){ return false; }
  }
  box.addEventListener("submit",async e=>{ e.preventDefault(); const pw=document.getElementById("pw").value;

  let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}

  else document.getElementById("pw").focus();
