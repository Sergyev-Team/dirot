<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">

<style>

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{font:inherit;font-size:14px;border-radius:20px;padding:5px 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}

.upbtn{position:relative}
.box{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}.box.bad{background:#fde2e2;color:#8a1c1c}.box.warn{background:#fff3d6;color:#7a5200}.box.nw{background:#e3f4ea;color:#17703f}.box.upd{background:#e3ecfb;color:#1d4fa0}.box.mrg{background:#efe6fb;color:#5a2a9c}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.who button{font:inherit;font-weight:800;font-size:16px;border-radius:14px;padding:14px 8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;line-height:1.3}
.who button small{display:block;font-weight:600;font-size:13px;color:var(--muted)}.who button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}@media(max-width:520px){.g2.st{grid-template-columns:1fr}}
label.l{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700;color:var(--muted)}
.ar{display:flex;gap:6px}.ar input{flex:1}
.sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}.sug button{font:inherit;font-size:15px;text-align:right;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px;cursor:pointer}
.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:7px 10px;font-size:15px;margin-top:6px}.pr button{border:0;background:none;color:var(--off);font-size:18px;cursor:pointer}
.ex{background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin:10px 0}.ex label.chk{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--fg)}.ex label.chk input{width:22px;height:22px}
.ct{border-bottom:1px solid var(--line);padding:10px 0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.stt{font-size:13px;font-weight:800;border-radius:999px;padding:2px 9px;background:#fff3d6;color:#7a5200}.stt.ok{background:#e3f4ea;color:#17703f}
.tp{font-size:12px;font-weight:800;border-radius:8px;padding:1px 7px;background:var(--gold-soft);color:var(--gold);margin-inline-start:4px}
a.btn{text-decoration:none}.btn.wa{background:var(--wa)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17150f;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1}
.g2>*{min-width:0}
input[type=date],select{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:48px;line-height:30px;text-align:right}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px 21px,22px 21px;background-size:6px 6px;background-repeat:no-repeat;padding-left:34px}
input[type=date]::-webkit-date-and-time-value{text-align:right}
.ex{overflow:hidden}.ex label.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;line-height:1.35;margin-bottom:6px}
.ms{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.ms .lbl{font-weight:800;margin:0 0 6px}.mngb{width:100%;margin-top:8px;display:flex;justify-content:center;text-decoration:none;box-sizing:border-box}.hr{height:1px;background:var(--line);margin:12px 0}.cnt2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}.tn{display:flex;gap:4px;flex-shrink:0}.tn .btn{min-width:40px}.cnt2>span:first-child{font-weight:800;min-width:110px}.cnt2 input{width:70px;text-align:center}.cnt2 b{font-size:17px;color:var(--gold)}label.chk{display:flex;gap:8px;align-items:center;font-weight:700;margin:6px 0}label.chk input{width:20px;height:20px}.edl{background:var(--bg);border-radius:10px;padding:8px;margin:4px 0}
body.mngmode #modes,body.mngmode .own-top{display:none!important}.upd{text-align:center;margin:4px 0}
.oc{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.oc h3{margin:0;font-size:17px}.oc .meta{color:var(--muted);font-size:14px}
.oc .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.oc .acts .btn{width:100%}
.nb{display:inline-block;background:#c0392b;color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:1px 8px;margin-inline-start:6px}
.lg{font-size:14px;border-top:1px dashed var(--line);padding:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.lg label{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.mm{padding:7px 10px;border-radius:12px;margin:5px 0;font-size:14px;white-space:pre-wrap}.mm.o{background:var(--gold-soft)}.mm.f{background:var(--bg);border:1px solid var(--line)}.mm small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:99px;padding:6px 10px;cursor:pointer}.chips button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:800}
</style></head><body>
<div class="wrap">
 <h1>לוח <b>החתמות</b></h1><p class="sub">שליחת טפסי תיווך לחתימה דיגיטלית בוואטסאפ</p>
 <div class="tabs" id="modes"><button data-m="new">➕ טופס חדש</button><button data-m="list">📄 טפסים שנשלחו</button><button data-m="own" id="ownT">🏠 פורטל בעלים</button></div>
 <section class="mode" id="m-new"><div class="card" id="nw"></div></section>
 <div class="card" id="mngHd" hidden><b style="font-size:19px"></b><p class="hint" style="margin:4px 0 0">כל שינוי כאן מתעדכן בפורטל של בעל הנכס. אפשר לסגור את הלשונית בסיום.</p></div><section class="mode" id="m-own"><p class="hint upd" id="oUp" hidden>🔄 מעדכן נתונים…</p><div class="card own-top"><div class="row"><button class="btn" id="oNewT" style="flex:1">➕ פורטל חדש לבעל נכס</button><button class="btn ghost sm" id="oR">🔄</button></div><div id="oNew" hidden></div></div><div id="oLs"><p class="hint">טוען…</p></div></section>
 <section class="mode" id="m-list"><p class="hint upd" id="lUp" hidden>🔄 מעדכן נתונים…</p><div class="card"><div class="row"><input id="lq" placeholder="חיפוש לפי שם או טלפון" style="flex:1"><button class="btn ghost sm" id="lr">🔄 רענון</button></div><div id="ls"></div></div></section>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== לוח החתמות – משרד סרגייב ===== */
let U=null;
const SITE="https://sergyev-team.github.io/dirot/";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fm=n=>n?"₪"+Number(n).toLocaleString("en-US"):"";
const pad=n=>("0000"+n).slice(-5);
function toast(t,ms){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms||2200)}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addM=(s,m)=>{const d=new Date(s+"T12:00:00");const day=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()<day)d.setDate(0);return iso(d)};
const WHO={sell:["🏷️ בעל נכס – מכירה","הסכמה + בלעדיות"],let:["🔑 בעל נכס – השכרה","הסכמה + בלעדיות"],buy:["🛒 קונה","הזמנת שירותי תיווך לקנייה"],rentin:["🏠 שוכר","הזמנת שירותי תיווך לשכירות"]};
const TL={sell:"מוכר",let:"משכיר",buy:"קונה",rentin:"שוכר"};
const wa=(ph,txt)=>"https://wa.me/972"+String(ph||"").replace(/\D/g,"").replace(/^972/,"").replace(/^0/,"")+"?text="+encodeURIComponent(txt);
const stN=p=>{let s=String(p&&p.addr||"").split(",")[0].replace(/\s*\d+[א-ת]?\s*$/,"").trim();if(!s)return"";return /^(רחוב|רח'|שד'|שדרות|סמטת|דרך|כיכר)/.test(s)?"ב"+s.replace(/^רח'\s*/,"רחוב "):"ברחוב "+s};
const msg=(name,link,two,pr,tp)=>(tp==="sell"||tp==="let")?"שלום "+(name||"")+" 👋\nשמחים על האמון שלכם ועל ההחלטה "+(tp==="let"?"להשכיר":"לשווק")+" את הדירה"+(stN(pr&&pr[0])?" "+stN(pr[0]):"")+" דרכנו 🏡\n\nמצרף קישור לחתימה על הסכם שיווק"+(two?" ובלעדיות":"")+". החתימה דיגיטלית ולוקחת דקה 🙏\n👇\n"+link+"\n\n"+(two?"מיד אחרי החתימה יגיע אליכם מייל עם כניסה לפורטל אישי של הנכס – שם תוכלו לראות בכל רגע את הפרסומים, הפניות, הקונים המתאימים והפגישות.\n\n":"")+"יוצאים לדרך! 💪\nמשה מאיר כהן – צוות סרגייב\n📞 054-9071916":"שלום "+(name||"")+" 👋\nשמחים שקבענו פגישה"+(stN(pr&&pr[0])?" לראות את הדירה "+stN(pr[0]):"")+" 🏡\n\nכדי שנוכל להגיע ולהתמקד ישר בדירה, מצרף קישור לחתימה על הזמנת שירותי תיווך. נא לחתום לפני הפגישה 🙏\n👇\n"+link+"\n\nמחכים לראותך!\nמשה מאיר כהן – צוות סרגייב\n📞 054-9071916";
let F=null;
/* נכסים ידניים ולקוחות שמורים – נשמרים בטלפון ובגיליון */
let SAVED={props:[],clients:[]};try{const s=JSON.parse(localStorage.getItem("sg_saved")||"null");if(s){SAVED.props=s.props||[];SAVED.clients=s.clients||[]}}catch(e){}
const phN=p=>String(p||"").replace(/\D/g,"").replace(/^972/,"0");
function svMerge(s){(s.props||[]).forEach(p=>{if(p&&p.addr&&!SAVED.props.some(q=>q.addr===p.addr))SAVED.props.push(p)});(s.clients||[]).forEach(c=>{if(c&&c.name&&!SAVED.clients.some(q=>phN(q.phone)===phN(c.phone)&&q.name===c.name))SAVED.clients.push(c)});try{localStorage.setItem("sg_saved",JSON.stringify(SAVED))}catch(e){}}
function svPut(){try{localStorage.setItem("sg_saved",JSON.stringify(SAVED))}catch(e){}if(U&&U.sync&&!U.agent)fetch(U.sync.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({t:U.sync.token,set:{sg_saved:JSON.stringify(SAVED)}})}).catch(()=>{})}
async function svPull(){if(!U||!U.sync||U.agent)return;try{const j=await(await fetch(U.sync.url+"?t="+encodeURIComponent(U.sync.token))).json();const v=j&&j.data&&j.data.sg_saved;if(v)svMerge(JSON.parse(v))}catch(e){}}
function reset(t){const today=iso(new Date());F={type:t||F&&F.type||"sell",hide:false,name:"",phone:"",props:[],fee:2,months:1,excl:true,from:today,mon:6,to:addM(today,6),notes:""}}
const owner=()=>F.type==="sell"||F.type==="let",rent=()=>F.type==="let"||F.type==="rentin";
function keep(){const g=id=>{const x=document.getElementById(id);return x?x.value:null};
 if(g("nN")!=null){F.name=g("nN").trim();F.phone=g("nP").trim();F.notes=g("nT");if(rent())F.months=+g("nF")||1;else F.fee=+String(g("nF")).replace(/[^\d.]/g,"")||2;
  {const h=document.getElementById("nH");if(h)F.hide=h.checked}
  if(owner()){const x=$("#nX");F.excl=x.checked;if(F.excl){F.from=g("nFr")||F.from;F.to=g("nTo")||F.to}}}}
function drawNew(){const own=owner(),A=(U.apts||[]).filter(x=>!x.deal||(rent()?x.deal==="השכרה":x.deal!=="השכרה"));
 $("#nw").innerHTML=`<p class="lbl" style="margin-top:0">מי חותם?</p><div class="who">${Object.entries(WHO).map(([k,v])=>`<button type="button" data-t="${k}" class="${F.type===k?"on":""}">${v[0]}<small>${v[1]}</small></button>`).join("")}</div>
 <div class="g2 st"><label class="l">שם הלקוח (חיפוש בקונים שלך או לקוח חדש)<input id="nN" value="${E(F.name)}" autocomplete="off" placeholder="מתחילים להקליד שם…"></label><label class="l">טלפון (לוואטסאפ)<input id="nP" type="tel" value="${E(F.phone)}" autocomplete="off"></label></div><div class="sug" id="nNs"></div>
 <p class="lbl">${own?"הנכס":"הנכסים שהוצגו ללקוח"}</p>
 <div class="ar"><input id="nA" placeholder="מספר נכס או רחוב, למשל 416 או סוקולוב" autocomplete="off"><button type="button" class="btn ghost" id="nAadd">➕ הוסף</button></div><div class="sug" id="nS"></div>
 <details style="margin-top:8px"><summary class="hint">או הוספה ידנית (נכס שלא בלוח)</summary><div class="g2 st"><label class="l">רחוב *<input id="nMs" placeholder="למשל קלישר"></label><label class="l">מספר בית *<input id="nMh" inputmode="numeric" placeholder="38"></label></div>
 <div class="g2 st"><label class="l">קומה *<input id="nMf" inputmode="numeric" placeholder="0 = קרקע"></label><label class="l">מספר דירה (לא חובה)<input id="nMd" inputmode="numeric"></label></div>
 <div class="g2 st"><label class="l">עיר<input id="nMc" value="פתח תקווה"></label><label class="l">${rent()?"שכר דירה חודשי":"מחיר"}<input id="nMp" inputmode="numeric"></label></div>
 <div class="chips" id="nMx"><button type="button" data-f="pk">🚗 חניה</button><button type="button" data-f="pk2">🚗🚗 2 חניות</button><button type="button" data-f="el">🛗 מעלית</button><button type="button" data-f="mm">🛡️ ממ״ד</button></div>
 <div class="g2"><label class="l">סוג<input id="nMt" value="דירה"></label><button type="button" class="btn ghost" id="nMadd" style="align-self:end">➕ הוסף</button></div></details>
 <div id="nPr"></div>
 ${own?`<div class="ex"><label class="chk"><input type="checkbox" id="nX" ${F.excl?"checked":""}> כולל הסכם בלעדיות (באותו קישור)</label>
  <div id="nXw" ${F.excl?"":"hidden"}><div class="g2"><label class="l">מתאריך<input type="date" id="nFr" value="${F.from}"></label><label class="l">תקופה<select id="nMo">${[1,2,3,4,5,6,9,12].map(m=>`<option value="${m}" ${F.mon===m?"selected":""}>${m} חודשים</option>`).join("")}<option value="0" ${F.mon===0?"selected":""}>תאריך אחר…</option></select></label></div>
  <label class="l">עד תאריך<input type="date" id="nTo" value="${F.to}"></label></div></div>`:""}

  async function open(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
