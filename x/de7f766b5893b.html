/* ===== לוח החתמות – משרד סרגייב ===== */

const STG={"":["בשיווק","var(--muted)","var(--bg)"],offer:["יש הצעה","var(--info)","var(--infoS)"],nego:["במו״מ","var(--gold)","var(--gold-soft)"],closed:["נסגר","var(--ok)","var(--okS)"],off:["ירד מהשיווק","var(--muted)","var(--bg)"]};

function ceoCalc(x){const fee=x.fee||2,est=!x.fee,base=x.stage==="closed"?(x.dealPrice||x.maxOffer||x.price):x.stage==="nego"?(x.maxOffer||x.price):x.stage==="offer"?x.maxOffer:0;return {fee,est,base,amt:base*fee/100}}

function ceoDraw(){const w=$("#m-ceo"),D=CEO,now=new Date(),ym=now.toISOString().slice(0,7);
 const ags=[...new Set(D.items.map(x=>x.agent))];const I=D.items.filter(x=>!CEOAG||x.agent===CEOAG);
 const act=I.filter(x=>x.stage!=="off"&&!(x.stage==="closed"&&String(x.stAt).slice(0,7)!==ym));
 const grp={offer:0,nego:0,closed:0};let estN=0;act.forEach(x=>{const c=ceoCalc(x);if(x.stage in grp&&c.amt){grp[x.stage]+=c.amt;if(c.est)estN++}});
 const total=grp.offer+grp.nego+grp.closed,cols={offer:"var(--info)",nego:"var(--gold)",closed:"var(--ok)"},lab={offer:"יש הצעה",nego:"במו״מ",closed:"נסגר החודש"};
 // התראות
 const AL=[];
 act.filter(x=>x.exDays!=null&&x.exDays<=30&&x.stage!=="closed").sort((a,b)=>a.exDays-b.exDays).forEach(x=>AL.push({c:x.exDays<=7?"var(--bad)":"var(--warn)",t:`הבלעדיות ב${x.addr} ${x.exDays<0?"נגמרה לפני "+(-x.exDays)+" ימים":x.exDays===0?"נגמרת היום":"נגמרת בעוד "+x.exDays+" ימים"}`,s:`עד ${x.exTo.split("-").reverse().join("/")} · ${x.owner||""}`,id:x.id,a:"לחדש"}));
 act.filter(x=>x.days>45&&!["closed","nego"].includes(x.stage)).sort((a,b)=>b.days-a.days).forEach(x=>{const wk=Math.max(1,x.days/7),tpw=x.tours/wk;let rec;

  else if(x.price){const pct=tpw<1?5:3,np=Math.round(x.price*(1-pct/100)/10000)*10000;rec=`מחיר לבדיקה: ${fmK(np)} (−${pct}%) · ${x.tours} סיורים ו-${x.leads} פניות ב-${x.days} ימים`+(x.maxOffer?` · הצעה גבוהה ${fmK(x.maxOffer)}`:"")}

 const rows=I.slice().sort(sorters[CEOSORT]).map(x=>{const col=x.days>45?"var(--bad)":x.days>30?"var(--warn)":"var(--ok)",g=STG[x.stage]||STG[""];
  return `<tr><td><a href="${E(mngUrl(x.id))}" target="_blank" rel="noopener">${E(x.addr)}</a><div class="hint" style="font-size:13px">#${E(x.id)} · ${E(x.agent)}${x.price?" · "+fmK(x.price):""}</div></td>

    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
    const u8=new Uint8Array(plain);if(u8[0]===0x1f&&u8[1]===0x8b)return JSON.parse(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text());return JSON.parse(new TextDecoder().decode(plain));
  }
  const wrap=document.querySelector(".wrap"); wrap.hidden=true;
  const box=document.createElement("form"); box.className="lock";
  box.innerHTML='<h1>לוח <b>החתמות</b></h1><p>הדף מוגן בסיסמה.</p><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit" class="btn wa">כניסה</button><p class="err" id="err" hidden>הסיסמה לא נכונה. נסו שוב.</p>';
  const st=document.createElement("style");
  st.textContent='.lock{max-width:380px;margin:12vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:10px}.lock h1{font-size:28px}.lock label{font-weight:700}.lock input{font:inherit;font-size:20px;padding:10px 14px;min-height:52px;border-radius:12px;border:2px solid var(--gold);background:var(--surface);color:var(--fg);direction:ltr}.lock .err{color:var(--off);font-weight:700;margin:0}';
  document.head.appendChild(st); document.body.prepend(box);
  async function tryPw(pw,remember){
    try{ const data=await open(pw); box.remove(); wrap.hidden=false;
      if(remember){ try{ localStorage.setItem(KEY,pw); }catch(e){} }
      boot(data); return true; }catch(e){ return false; }
  }
  box.addEventListener("submit",async e=>{ e.preventDefault(); const pw=document.getElementById("pw").value;
    if(!(await tryPw(pw,true))){ document.getElementById("err").hidden=false; } });
  let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){ tryPw(saved,false).then(ok=>{ if(!ok){ try{ localStorage.removeItem(KEY); }catch(e){} } }); }
  else document.getElementById("pw").focus();
})();
</script></body></html>
