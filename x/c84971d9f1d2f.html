<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>לוח מתווך סרגייב</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one sticky search bar, then a single column of property files (number first, then the brokers to contact). Tool UI, black/gold brand. */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --fg:#17150f; --muted:#615b4c; --line:#e3ddcf;
  --gold:#a87b1e; --gold-soft:#f6ecd4; --wa:#138a4e; --wa-ink:#ffffff;
  --ok:#1f7a48; --ok-bg:#e5f3ea; --warn:#9a5b00; --warn-bg:#fbefd9; --off:#9b2c2c; --off-bg:#f8e3e3;
  --body:"Assistant","Arial Hebrew","Arial",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12110e; --surface:#1c1a16; --fg:#f1ecdf; --muted:#b3ab98; --line:#322e26;
  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --wa-ink:#ffffff;
  --ok:#7fd3a3; --ok-bg:#15291d; --warn:#f0bf6a; --warn-bg:#2d2312; --off:#f19c9c; --off-bg:#2e1717; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12110e; --surface:#1c1a16; --fg:#f1ecdf; --muted:#b3ab98; --line:#322e26;
  --gold:#e3b858; --gold-soft:#2e2615; --wa:#1a9a5a; --wa-ink:#ffffff;
  --ok:#7fd3a3; --ok-bg:#15291d; --warn:#f0bf6a; --warn-bg:#2d2312; --off:#f19c9c; --off-bg:#2e1717; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;text-align:right}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.01em}
h1 b{color:var(--gold)}
.meta{font-size:14px;color:var(--muted)}
.search{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;color:var(--fg);background:var(--surface);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;min-height:54px}
#q:focus-visible{outline:3px solid var(--gold-soft);outline-offset:1px}
#clear{font:inherit;font-weight:700;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:0 14px;cursor:pointer}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.sect{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:18px 0 8px}
.list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.num small{font-size:15px;font-weight:700;color:var(--muted);margin-inline-start:2px}
.pill{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px}
.pill.active{background:var(--ok-bg);color:var(--ok)}
.pill.expired{background:var(--off-bg);color:var(--off)}
.pill.hidden{background:var(--warn-bg);color:var(--warn)}
.price{margin-inline-start:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.price s{display:block;font-size:13px;font-weight:600;color:var(--off);text-align:left}
.title{font-size:19px;font-weight:700;margin:0;text-wrap:balance}
.addr{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:700;border-radius:8px;padding:2px 9px;background:var(--gold-soft);color:var(--fg)}
.chip.no{background:var(--off-bg);color:var(--off)}
.dates{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.brokers{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.bk{display:flex;flex-direction:column;gap:6px}
.bk-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bk-name{font-weight:800}
.bk-tel{font-weight:700;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.bk-last{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border-radius:10px;padding:9px 12px;min-height:44px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);flex:1 1 140px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.gold{border-color:var(--gold);color:var(--fg);background:var(--gold-soft)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.client{border-top:1px dashed var(--line);padding-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;max-width:520px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.btn.rm{background:#b3261e;border-color:#b3261e;color:#fff}
.rmbox{border:2px solid #b3261e;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rmq{font-weight:800}
.rmin{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1.5px solid #b3261e;min-height:42px}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><h1>לוח <b>מתווך</b></h1><span class="meta" id="meta"></span></div>
    <form class="search" id="f" role="search">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="מספר נכס, רחוב, שכונה או מתווך" aria-label="חיפוש נכס">
      <button type="button" id="clear">ניקוי</button>
    </form>
    <p class="hint">הקלידו מספר נכס (למשל 187) כדי לקבל את פרטי הדירה ואת המתווכים שפרסמו אותה.</p>
  </div>
  <div class="sect" id="sect">עודכנו לאחרונה</div>
  <ul class="list" id="list" aria-live="polite"></ul>
</div>
<div id="toast" role="status"></div>

<script>
function boot(P){
const D = P.rows || P; const API = P.script || "", TOK = P.token || "";
const CUT = "2026-08-20";
const SITE = "https://sergyev-team.github.io/dirot/";
const SHEET = "https://docs.google.com/spreadsheets/d/1qhBZ4_kzrUbuBn5hTK63RGL1jzjoKA_wOI5ZxShYA6g/edit#gid=0&range=A";
const ME = "היי, מה המצב? זה משה כהן מהצוות של אלכס סרגייב.";
const byId = new Map(); D.forEach(x => x.ids.forEach(i => byId.set(i, x)));
const $ = id => document.getElementById(id);
const nf = n => Number(n).toLocaleString("en-US");
const dd = s => s ? s.split("-").reverse().join("/") : "";
const ST = x => x.street ? x.street + (x.hn ? " " + x.hn : "") : "";
const norm = s => String(s||"").replace(/["'״׳\-\.]/g,"").replace(/\s+/g," ").trim().toLowerCase();
const wa = (phone, msg) => "https://wa.me/" + (phone ? "972" + phone.replace(/\D/g,"").replace(/^0/,"") : "") + "?text=" + encodeURIComponent(msg);
function el(t, c, txt){ const e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e; }
function toast(m){ const t=$("toast"); t.textContent=m; t.className="show"; clearTimeout(t._h); t._h=setTimeout(()=>t.className="",2200); }
function copy(text){ try{ navigator.clipboard.writeText(text).then(()=>toast("הועתק: "+text),()=>toast(text)); }catch(e){ toast(text); } }
function link(cls, label, href){ const a=el("a","btn "+cls,label); a.href=href; a.target="_blank"; a.rel="noopener"; return a; }
const RM_REASONS = ["נמכרה","ירדה מהשיווק","הוקפאה"];
async function api(body){ const r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({t:TOK},body))}); return r.json(); }
function applyRemoved(m){ D.forEach(x=>{ const r=m[String(x.id)]; if(r && x.status=="active"){ x.status="removed"; x.rmLive=true; } if(r) x.rmReason=r; if(!r && x.rmLive){ x.status="active"; x.rmLive=false; x.rmReason=""; } }); }
function rmBox(x,li){ const box=el("div","rmbox"); box.append(el("div","rmq","למה הדירה יורדת?"));
  const row=el("div","row"); let other=null;
  const go=async reason=>{ const d=new Date(), p=n=>String(n).padStart(2,"0"); const r=reason+" ("+p(d.getDate())+"/"+p(d.getMonth()+1)+")";
    box.querySelectorAll("button").forEach(b=>b.disabled=true); toast("מוריד מהאתר…");
    try{ const j=await api({action:"removeApt",id:x.id,reason:r}); if(!j.ok) throw j.error; if(!j.removed) throw "old"; applyRemoved(j.removed); toast("נכס "+x.id+" ירד מהאתר"); render(); }
    catch(e){ toast(e=="id mismatch"?"מספר הנכס לא תואם לשורה בגיליון":e=="old"?"הקוד בגיליון עדיין בגרסה הישנה – צריך פריסה חדשה (New version)":"לא הצלחתי להתחבר לגיליון. נסו שוב."); box.querySelectorAll("button").forEach(b=>b.disabled=false); } };
  RM_REASONS.forEach(t=>{ const b=el("button","btn rm",t); b.type="button"; b.onclick=()=>go(t); row.append(b); });
  const ob=el("button","btn","אחר…"); ob.type="button"; ob.onclick=()=>{ if(!other){ other=el("input"); other.placeholder="סיבה (למשל: בעלים חזר בו)"; other.className="rmin"; const ok=el("button","btn rm","הורדה"); ok.type="button"; ok.onclick=()=>go(other.value.trim()||"אחר"); box.append(other,ok); other.focus(); } };
  row.append(ob); const cx=el("button","btn","ביטול"); cx.type="button"; cx.onclick=()=>box.remove(); row.append(cx);
  box.append(row); return box; }
const STATUS = {active:["באתר","active"], removed:["הוסר מהאתר","expired"], expired:["ירד מהפרסום","expired"], hidden:["לא באתר · חסרים פרטים","hidden"]};

function card(x){
  const li = el("li","card");
  const head = el("div","head");
  const num = el("div","num"); num.append(document.createTextNode(x.id)); if(x.ids.length>1){ num.append(el("small",null,"(גם "+x.ids.filter(i=>i!==x.id).join(", ")+")")); }
  const [st,sc] = STATUS[x.status]; head.append(num, el("span","pill "+sc, st+(x.status=="removed"&&x.rmReason?" – "+x.rmReason:"")));
  const pr = el("div","price", x.price ? nf(x.price)+" ₪" : "ללא מחיר");
  if(x.prev){ const s=el("s",null,nf(x.prev)+" ₪"); pr.append(s); }
  head.append(pr); li.append(head);
  const kind = (x.type||"דירה") + (x.rooms ? " " + x.rooms + " חדרים" : "") + (x.deal=="השכרה" ? " · להשכרה" : "");
  li.append(el("p","title",kind));
  li.append(el("p","addr",[ST(x)&&("רחוב "+ST(x)), x.nb, x.city].filter(Boolean).join(" · ") || "כתובת לא צוינה"));
  const ch = el("div","chips");
  if(x.floor!=="" && x.floor!=null) ch.append(el("span","chip", x.floor==0?"קרקע":"קומה "+x.floor));
  if(x.sqm) ch.append(el("span","chip", x.sqm+" מ״ר"));
  [["el","מעלית"],["pk","חניה"],["mm","ממ״ד"],["bal","מרפסת"]].forEach(([k,t])=>{ if(x[k]=="כן") ch.append(el("span","chip","✓ "+t)); else if(x[k]=="לא") ch.append(el("span","chip no","✗ "+t)); });
  if(x.cond) ch.append(el("span","chip",x.cond)); if(x.ren) ch.append(el("span","chip",x.ren));
  ch.append(el("span","chip", x.imgs ? x.imgs+" תמונות באתר" : "אין תמונות באתר"));
  li.append(ch);
  li.append(el("div","dates","פורסם לראשונה "+dd(x.first)+" · פרסום אחרון "+dd(x.last)));
  const where = ST(x) ? "ברחוב "+ST(x) : (x.nb ? "בשכונת "+x.nb : "שפרסמת");
  const rm = x.rooms ? " ("+x.rooms+" חדרים)" : "";
  const bks = el("div","brokers");
  x.brokers.forEach(b=>{
    const box=el("div","bk"); const top=el("div","bk-top");
    top.append(el("span","bk-name", b.name||"מתווך לא ידוע"));
    if(b.phone) top.append(el("span","bk-tel", b.phone.replace(/^(\d{3})(\d+)$/,"$1-$2")));
    top.append(el("span","bk-last","פרסם "+dd(b.last)+" · נכס "+b.id)); box.append(top);
    const r=el("div","row");
    if(b.phone){
      r.append(link("wa","עדיין רלוונטית?", wa(b.phone, ME+" יש לי קונה רציני לדירה "+where+rm+(x.price?", "+nf(x.price)+" ₪":"")+". היא עדיין רלוונטית? אפשר לתאם ביקור?")));
      r.append(link("","בקשת תמונות", wa(b.phone, ME+" יש לי קונה רלוונטי לדירה "+where+rm+". אפשר לשלוח לי תמונות בבקשה? תודה!")));
      const c=el("button","btn","העתקת מספר"); c.type="button"; c.addEventListener("click",()=>copy(b.phone)); r.append(c);
    } else r.append(el("span","bk-last","אין מספר טלפון שמור. אפשר להוסיף אותו בגיליון."));
    box.append(r); bks.append(box);
  });
  li.append(bks);
  const cl=el("div","row client");
  const title=kind+(ST(x)?" ברחוב "+ST(x):(x.nb?" ב"+x.nb:""))+(x.city?", "+x.city:"")+(x.price?" – "+nf(x.price)+" ₪":"");
  if(x.status=="active"){
    cl.append(link("gold","שליחה ללקוח", "https://wa.me/?text="+encodeURIComponent("היי, מצאתי לך דירה שיכולה להתאים:\n"+title+"\n"+SITE+"d/"+x.id+".html")));
    cl.append(link("gold","קונים מתאימים", SITE+"x/b018b2a874ee8.html#a="+x.id));
    cl.append(link("","דף הנכס באתר", SITE+"#p="+x.id));
    if(API){ const rb=el("button","btn rm","🚫 ירדה מהשיווק"); rb.type="button"; rb.onclick=()=>{ if(!li.querySelector(".rmbox")) li.append(rmBox(x,li)); }; cl.append(rb); }
  } else if(x.rmLive && API){ const ub=el("button","btn","↩ החזר לאתר"); ub.type="button";
    ub.onclick=async()=>{ ub.disabled=true; try{ const j=await api({action:"restoreApt",id:x.id}); if(!j.ok) throw 0; applyRemoved(j.removed); toast("נכס "+x.id+" חזר לאתר"); render(); }catch(e){ ub.disabled=false; toast("לא הצלחתי להתחבר לגיליון. נסו שוב."); } }; cl.append(ub); }
  cl.append(link("","שורה בגיליון", SHEET+(x.id+1)));
  li.append(cl);
  return li;
}
function render(){
  const q=$("q").value.trim(); const list=$("list"); list.innerHTML="";
  let r, title;
  if(!q){ r=[...D].sort((a,b)=>a.last<b.last?1:a.last>b.last?-1:b.id-a.id).slice(0,15); title="עודכנו לאחרונה"; }
  else if(/^\d+$/.test(q)){ const x=byId.get(+q); r=x?[x]:[]; title=x?"נכס מס' "+q:"אין נכס מס' "+q; }
  else { const w=norm(q).split(" "); r=D.filter(x=>{ const h=norm([ST(x),x.nb,x.city,x.type,x.brokers.map(b=>b.name+" "+b.phone).join(" ")].join(" ")); return w.every(t=>h.includes(t)); })
         .sort((a,b)=>(a.status=="active"?0:1)-(b.status=="active"?0:1)||(a.last<b.last?1:-1)).slice(0,40); title=r.length+" תוצאות"+(r.length==40?" (40 ראשונות)":""); }
  $("sect").textContent=title;
  if(!r.length){ list.append(el("li","empty", /^\d+$/.test(q)?"מספר הנכס הזה לא קיים בגיליון. בדקו את המספר ששלח הלקוח.":"לא נמצאו נכסים. נסו רחוב אחר או חלק משם הרחוב.")); return; }
  r.forEach(x=>list.append(card(x)));
}
$("meta").textContent = D.filter(x=>x.status=="active").length+" באתר · "+D.length+" בגיליון";
$("q").addEventListener("input",render);
if(API) fetch(API+"?removed=1").then(r=>r.json()).then(j=>{ if(j.ok){ applyRemoved(j.removed); render(); } }).catch(()=>{});
$("f").addEventListener("submit",e=>{ e.preventDefault(); $("q").blur(); });
$("clear").addEventListener("click",()=>{ $("q").value=""; render(); $("q").focus(); });
render();
