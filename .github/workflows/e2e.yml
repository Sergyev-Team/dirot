name: e2e-check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIROT_PW: ${{ secrets.DIROT_PW }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright cryptography && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/e2e.py
      - name: publish encrypted results to branch e2e-out
        run: |
          mkdir /tmp/out && cp /tmp/e2e.enc /tmp/out/ && cd /tmp/out && git init -q -b e2e-out && git add e2e.enc
          git -c user.name=Claude -c user.email=noreply@anthropic.com commit -qm "e2e results"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-out
