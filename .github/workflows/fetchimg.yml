name: fetchimg
on:
  push:
    paths: ['tmpai/urls.txt']
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpai/out
          while read n u; do curl -sSL -o "tmpai/out/$n.png" "$u"; done < tmpai/urls.txt
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add tmpai/out && git commit -m "fetched images" && git push
