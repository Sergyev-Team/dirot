name: deploy-sheet-code
on:
  push:
    branches: [main]
    paths: ['engine/gs/**']
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
concurrency:
  group: deploy-gs
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHEET_URL: https://script.google.com/macros/s/AKfycbxSon5hLywrAVGN2OGTQFec5uNZpkzgI243GnyBu230r1Sj5ErPJXXX414v9Tsl6UnC/exec
      DIROT_PW: ${{ secrets.DIROT_PW }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - run: python engine/gs_deploy.py deploy
